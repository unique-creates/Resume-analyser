/* ---------- base ---------- */
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:
    radial-gradient(circle at top left, rgba(61,125,255,0.20), transparent 30%),
    radial-gradient(circle at bottom right, rgba(104,154,255,0.14), transparent 24%),
    linear-gradient(180deg, #05162a 0%, var(--bg) 100%);
  color:var(--ink);font:400 15px/1.55 "Instrument Sans",sans-serif;-webkit-font-smoothing:antialiased
}
html.light body{
  background:
    radial-gradient(circle at top left, rgba(47,104,219,0.14), transparent 30%),
    radial-gradient(circle at bottom right, rgba(96,121,255,0.12), transparent 24%),
    linear-gradient(180deg, #f4f8ff 0%, var(--bg) 100%);
}
h1,h2,h3,h4{font-family:Sora,sans-serif;letter-spacing:-.01em}
a{color:inherit;text-decoration:none}
.mono{font-family:"JetBrains Mono",monospace}
.tnum{font-variant-numeric:tabular-nums}
::selection{background:var(--accent-soft)}
.lucide,.ic3,.ic4,.ic5,.ic6{width:16px;height:16px;flex:none}
.ic3{width:12px;height:12px}.ic5{width:20px;height:20px}.ic6{width:26px;height:26px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
/* ---------- primitives ---------- */
.card{background:linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 20px 40px -28px rgba(12,26,44,.55)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;cursor:pointer;font:600 14px/1 "Instrument Sans",sans-serif;height:40px;padding:0 16px;border-radius:10px;background:var(--btn-gradient);color:var(--accent-ink);transition:transform .15s ease, box-shadow .15s ease, filter .15s ease;box-shadow:0 12px 22px color-mix(in srgb, var(--accent) 35%, transparent)}
.btn:hover{transform:translateY(-1px);filter:saturate(1.08)}
.btn.outline{background:rgba(255,255,255,.04);color:var(--ink);border:1px solid var(--line)}.btn.outline:hover{background:var(--raised)}
.btn.ghost{background:transparent;color:var(--muted)}.btn.ghost:hover{background:var(--raised);color:var(--ink)}
.btn.danger{background:var(--danger);color:#fff}.btn.danger:hover{opacity:.9}
.btn.sm{height:32px;font-size:12.5px;padding:0 12px;border-radius:8px}
.btn.lg{height:46px;padding:0 22px;font-size:15px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.spin{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.input{width:100%;height:40px;border:1px solid var(--line);background:var(--bg);border-radius:10px;color:var(--ink);font:inherit;padding:0 14px}
textarea.input{height:auto;min-height:120px;padding:10px 14px;resize:vertical}
select.input{appearance:none;cursor:pointer}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
.input::placeholder{color:var(--faint)}
label.f{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:6px}
.badge{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:99px;font-size:12px;font-weight:500}
.badge.ok{background:var(--success-soft);color:var(--success)}.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--danger-soft);color:var(--danger)}.badge.acc{background:var(--accent-soft);color:var(--accent)}
.badge.neu{background:var(--raised);color:var(--muted);border:1px solid var(--line)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:4px 11px;font:500 12px "JetBrains Mono",monospace;transition:opacity .4s,transform .4s}
.chip.ok{background:var(--success-soft);color:var(--success)}
.chip.miss{background:var(--danger-soft);color:var(--danger)}
.chip.rec{background:var(--accent-soft);color:var(--accent)}
.chip.dim{opacity:0;transform:translateY(4px)}
.progress{height:8px;border-radius:99px;background:var(--raised);border:1px solid var(--line);overflow:hidden}
.progress>i{display:block;height:100%;border-radius:99px;transition:width .8s cubic-bezier(.2,.7,.3,1)}
.tabs{display:flex;gap:4px;background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:4px;width:fit-content;flex-wrap:wrap}
.tab{height:32px;padding:0 14px;border-radius:7px;border:none;background:transparent;color:var(--muted);font:500 12.5px "Instrument Sans",sans-serif;cursor:pointer}
.tab.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.iconbtn{display:grid;place-items:center;width:36px;height:36px;border:none;border-radius:9px;background:transparent;color:var(--muted);cursor:pointer}
.iconbtn:hover{background:var(--raised);color:var(--ink)}
.formerr{background:var(--danger-soft);color:var(--danger);padding:10px 14px;border-radius:10px;font-size:13.5px;margin-bottom:16px}
.empty-note{font-size:13px;color:var(--faint)}

.mnav{position:fixed;inset:0 0 auto;z-index:40;transition:background .2s,border-color .2s;border-bottom:1px solid transparent}

.quick-access-toggle:hover{background:linear-gradient(180deg, rgba(255,255,255,.22), rgba(255,255,255,.12))}

.quick-ai-button{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 14px;border:1px solid rgba(103,155,255,.32);border-radius:12px;background:linear-gradient(135deg, rgba(61,125,255,.18), rgba(107,184,255,.10));color:var(--ink);font:600 13px/1 "Instrument Sans",sans-serif;cursor:pointer;box-shadow:0 8px 18px -18px rgba(9,25,48,.75);margin-left:8px}
.quick-ai-button:hover{background:linear-gradient(135deg, rgba(61,125,255,.24), rgba(107,184,255,.14))}
.promo-rail{width:220px;background:linear-gradient(180deg, rgba(255,255,255,.92), rgba(233,241,255,.88));border:1px solid rgba(124,154,219,.26);border-radius:18px;padding:14px;box-shadow:0 26px 42px -28px rgba(6,18,36,.42);transition:all .18s ease;overflow:hidden;max-height:calc(100vh - 150px);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:var(--ink)}

.promo-link{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--muted);font-size:14px;text-decoration:none;transition:all .18s ease;border:1px solid transparent}

@media(max-width:960px){.promo-shell{display:block;padding-top:86px}.quick-access-command{position:static;margin-bottom:12px}.promo-rail{position:static;width:auto;margin-bottom:12px}.promo-rail.collapsed{width:100%;max-height:0}.promo-rail nav{grid-template-columns:repeat(2,minmax(0,1fr))}}

<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.294.0/dist/umd/lucide.min.js"></script>

<script>
'use strict';
/* ================================================================
   AI Resume Analyser — 404_codeX · single-file edition
   Runs entirely in the browser. localStorage acts as the database;
   passwords are salted + SHA-256 hashed, never stored in plain text.
================================================================ */

/* ---------------- utils ---------------- */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36);
const nowIso = () => new Date().toISOString();
const daysAgo = n => new Date(Date.now() - n*86400000).toISOString();
const fmtDate = iso => new Date(iso).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});
const fmtBytes = n => n >= 1048576 ? (n/1048576).toFixed(1)+' MB' : Math.max(1,Math.round(n/1024))+' KB';
const scoreColor = s => s < 50 ? 'var(--danger)' : s < 70 ? 'var(--warn)' : 'var(--success)';
const icons = () => window.lucide && lucide.createIcons();
let theme = document.documentElement.classList.contains('light') ? 'light' : 'dark';
function syncThemeButtons(){
  const isLight = document.documentElement.classList.contains('light');
  $$('#themeBtn, #themeBtnM').forEach(btn => {
    const icon = btn.querySelector('i');
    if (!icon) return;
    icon.setAttribute('data-lucide', isLight ? 'moon' : 'sun');
  });
  if (window.lucide) lucide.createIcons();
}
function toggleTheme(){
  theme = theme === 'dark' ? 'light' : 'dark';
  document.documentElement.classList.toggle('light', theme === 'light');
  localStorage.setItem('ara_theme', theme);
  syncThemeButtons();
}
function copyText(text, okMsg){
  const done = () => toast(okMsg || 'Copied to clipboard.','ok');
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text, done));
  else fallbackCopy(text, done);
}
function fallbackCopy(text, done){
  const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta);
  ta.select(); try { document.execCommand('copy'); done(); } catch { toast('Could not copy — select the text manually.','error'); }
  ta.remove();
}

/* ---------------- storage ("database") ---------------- */
const DB = {
  get(k, fb){ try { const v = JSON.parse(localStorage.getItem('ara_'+k)); return v ?? fb; } catch { return fb; } },
  set(k, v){ localStorage.setItem('ara_'+k, JSON.stringify(v)); }
};
const users = () => DB.get('users', []);
const saveUsers = v => DB.set('users', v);
const resumes = () => DB.get('resumes', []);
const saveResumes = v => DB.set('resumes', v);
const analyses = () => DB.get('analyses', []);
const saveAnalyses = v => DB.set('analyses', v);
const myAnalyses = () => analyses().filter(a => a.userId === session()?.userId).sort((a,b) => b.createdAt < a.createdAt ? -1 : 1);
const myResumes = () => resumes().filter(r => r.userId === session()?.userId).sort((a,b) => b.uploadedAt < a.uploadedAt ? -1 : 1);
const lastResumeId = () => DB.get('last_resume_id', null);
const setLastResume = id => DB.set('last_resume_id', id);

/* ---------------- auth (hashed passwords + sessions) ---------------- */
async function sha256(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
}
async function hashPw(pw, salt){
  // crypto.subtle is available on localhost / file:// (trustworthy contexts);
  // tiny fallback keeps the demo usable in exotic browsers.
  if (crypto.subtle) return sha256(salt + '::' + pw);
  let h = 0x811c9dc5;
  for (const c of salt + '::' + pw) { h ^= c.charCodeAt(0); h = Math.imul(h, 0x01000193) >>> 0; }
  return 'fnv:' + h.toString(16);
}
const session = () => DB.get('session', null);
const currentUser = () => { const s = session(); return s ? users().find(u => u.id === s.userId) || null : null; };
const ADMIN_EMAILS = ['admin@404codex.dev', 'vedangtiwari2018@gmail.com'];
const isAdminUser = u => !!u && (u.role === 'admin' || ADMIN_EMAILS.includes(String(u.email || '').toLowerCase()));
function setSession(u){ DB.set('session', { userId: u.id, token: uid() + uid() }); }
function logout(){ localStorage.removeItem('ara_session'); }

/* ================================================================
   ANALYSIS ENGINE — deterministic, explainable, content-sensitive
================================================================ */
const clamp = n => Math.max(0, Math.min(100, Math.round(n)));
const titleCase = s => s.toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
const escapeRx = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const dedupe = arr => [...new Set(arr.map(s => String(s).trim().toLowerCase()).filter(Boolean))];

const STOPWORDS = new Set(`a an the and or but for with from into to of in on at by as is are was were be been being this that these those your you our their we they it its will can have has had do does did not no nor so if then than when where which who whom what how all any both each few more most other some such only own same too very just also may might should would could must requirements required preferred plus etc strong good great excellent ability able experience experiences year years role roles work working works team teams skill skills looking join candidate candidates company companies including include includes responsible responsibilities opportunity opportunities salary benefits location remote hybrid onsite full time part stack developer developers engineer engineers manager designers analyst analysts science scientist data software web application applications production code coding quality tools tool systems system new best like well across within using use used help helps ensure build create support deliver manage drive`.split(/\s+/));

const ROLE_LIBRARY = {
  'software developer': ['javascript','typescript','python','java','c++','git','sql','rest api','docker','unit testing','data structures','algorithms','ci/cd','linux'],
  'full stack developer': ['javascript','typescript','react','node.js','express','mongodb','html','css','rest api','git','docker','testing','responsive design','deployment'],
  'data analyst': ['sql','excel','python','pandas','tableau','power bi','statistics','data visualization','r','data cleaning','dashboards','a/b testing'],
  'web developer': ['html','css','javascript','react','node.js','responsive design','rest api','git','typescript','tailwind','seo','accessibility'],
  'ai/ml engineer': ['python','machine learning','deep learning','tensorflow','pytorch','nlp','pandas','numpy','scikit-learn','computer vision','mlops','data preprocessing'],
  'data scientist': ['python','r','sql','machine learning','statistics','pandas','scikit-learn','data visualization','hypothesis testing','spark','feature engineering'],
  'cloud engineer': ['aws','azure','gcp','docker','kubernetes','terraform','ci/cd','linux','networking','infrastructure as code','monitoring','lambda'],
  'cybersecurity analyst': ['network security','penetration testing','siem','firewalls','incident response','vulnerability assessment','encryption','risk assessment','python','linux'],
  'business analyst': ['requirements gathering','stakeholder management','sql','data analysis','process improvement','agile','user stories','documentation','power bi','excel','wireframing'],
  'product manager': ['product roadmap','user research','stakeholder management','agile','scrum','a/b testing','kpi','prioritization','product strategy','user stories','go-to-market'],
  'ui/ux designer': ['figma','user research','wireframing','prototyping','usability testing','design systems','accessibility','interaction design','user flows','personas']
};
const SKILL_ALIASES = {
  javascript: ['javascript','js','es6'], typescript: ['typescript'],
  nodejs: ['node.js','nodejs','node'], react: ['react','reactjs','react.js'],
  'ci/cd': ['ci/cd','ci-cd','cicd','continuous integration','continuous deployment','github actions','jenkins'],
  'power bi': ['power bi','powerbi'], 'a/b testing': ['a/b testing','ab testing','a/b test','ab test'],
  'rest api': ['rest api','rest apis','restful','restful api','restful apis','api development'],
  'ui/ux': ['ui/ux','ui ux','user experience'], 'c++': ['c++','cpp'], testing: ['testing','tests','unit test','unit tests']
};
const KNOWN_SKILLS = dedupe([...Object.values(ROLE_LIBRARY).flat(),
  'graphql','next.js','postgresql','mysql','tailwind','redux','jest','docker','kubernetes','terraform',
  'aws','azure','gcp','figma','jira','agile','scrum','git','linux']);
const ACTION_VERBS = ['developed','built','designed','implemented','created','led','launched','automated','optimized','optimised','improved','delivered','architected','engineered','deployed','migrated','reduced','increased','analyzed','analysed','mentored','shipped','wrote','owned','drove'];
const DEGREE_RX = /\b(b\.?\s?tech|b\.?\s?e\b|bachelor|b\.?sc|m\.?\s?tech|master|m\.?sc|mca|ph\.?d|diploma)\b/i;
const SECTION_HEADINGS = [
  ['summary', /^(professional\s+)?(summary|profile|objective|about\s+me)$/],
  ['skills', /^((technical|core|key|primary)\s*)?(skills|technologies|tech\s*stack|technical\s*skills)$/],
  ['education', /^(education|academics?|academic\s+(background|qualifications?)|educational\s+qualifications?)$/],
  ['experience', /^((work|professional|employment|industry)\s*)?(experience|history)$/],
  ['projects', /^(projects?|personal\s+projects|academic\s+projects|key\s+projects)$/],
  ['certifications', /^(certifications?|licenses?|courses?|trainings?)$/],
  ['achievements', /^(achievements?|awards?|honou?rs?|accomplishments?|extra[-\s]?curricular(\s+activities)?)$/]
];

function hasSkill(text, skill){
  const lower = text.toLowerCase();
  return (SKILL_ALIASES[skill] || [skill]).some(a =>
    /[^\w\s]/.test(a) ? lower.includes(a) : new RegExp(`\\b${escapeRx(a)}\\b`).test(lower));
}

function parseResume(text){
  const lines = text.split(/\r?\n/).map(l => l.replace(/\t/g,'  ')).filter(l => l.trim().length > 0);
  const sections = {}; let current = null;
  for (const line of lines){
    const key = line.trim().toLowerCase().replace(/[:•·|]+$/g,'').replace(/[_=~-]{3,}/g,'').trim();
    const hit = key.length <= 38 ? SECTION_HEADINGS.find(([,rx]) => rx.test(key)) : undefined;
    if (hit){ current = hit[0]; sections[current] = ''; continue; }
    if (current) sections[current] += line + '\n';
  }
  const bulletLines = lines.filter(l => /^\s*([-•*–▪◦]|\d+\.)\s+/.test(l) && l.trim().length > 18);
  const quantified = bulletLines.filter(l => /\d+\s*(%|percent|k\b|users|hours|clients|projects|members|times)|\b\d{2,}\b/.test(l));
  return {
    sections,
    contact: {
      email: text.match(/[\w.+-]+@[\w-]+\.[\w.]{2,}/)?.[0],
      phone: text.match(/(?:phone|mobile|tel|cell|ph)\s*[:\-]?\s*(\+?\d[\d\s().-]{7,}\d)/i)?.[1]
        ?? text.match(/(?:\+\d{1,3}[-.\s]?)?\(?\d{3}\)?[-.\s]?\d{3}[-.\s]?\d{4}\b/)?.[0],
      linkedin: text.match(/linkedin\.com\/[\w-]+/i)?.[0],
      github: text.match(/github\.com\/[\w-]+/i)?.[0]
    },
    bulletLines, quantified,
    years: (text.match(/\b(19|20)\d{2}\b/g) || []).map(Number),
    wordCount: text.split(/\s+/).filter(Boolean).length
  };
}

function extractTopWords(jd, limit){
  const tokens = jd.toLowerCase().match(/[a-z]+(?:[.+#-][a-z]+)*/g) || [];
  const freq = new Map();
  for (const w of tokens){ if (STOPWORDS.has(w) || w.length < 3) continue; freq.set(w, (freq.get(w)||0) + 1); }
  for (let i = 0; i < tokens.length - 1; i++){
    const a = tokens[i], b = tokens[i+1];
    if (a.length < 3 || b.length < 3 || STOPWORDS.has(a) || STOPWORDS.has(b)) continue;
    const bg = a + ' ' + b; freq.set(bg, (freq.get(bg)||0) + 1.5);
  }
  return [...freq.entries()].sort((x,y) => y[1]-x[1] || x[0].localeCompare(y[0])).slice(0, limit).map(e => e[0]);
}

function detectRole(jd){
  let best = null, bestWords = 0;
  for (const key of Object.keys(ROLE_LIBRARY)){
    const words = key.split(' ').filter(w => w.length > 3);
    if (words.length && words.every(w => jd.toLowerCase().includes(w)) && words.length > bestWords){ best = key; bestWords = words.length; }
  }
  return best;
}
function inferLevel(years){
  if (!years.length) return 'fresher';
  const span = Math.max(...years) - Math.min(...years);
  return span >= 6 ? 'senior' : span >= 2 ? 'mid' : 'fresher';
}

function generateSummary(input){
  const role = titleCase(input.targetJob || 'Software Developer');
  const skills = (input.skills || []).map(s => String(s).trim()).filter(Boolean).slice(0, 4);
  const stack = skills.length ? ` Strong hands-on experience with ${skills.join(', ')}.` : '';
  const goals = (input.goals || '').trim();
  const goalLine = goals ? ` Looking for opportunities to ${goals.replace(/^i\s+(want|would like)\s+to\s+/i,'').replace(/\.$/,'')}.` : '';
  const v = input.variant || 0;
  if (input.level === 'senior')
    return `Senior ${role} with a record of owning features end-to-end and raising code quality across teams.${stack} Comfortable making architecture trade-offs and mentoring junior engineers.${goalLine}`;
  if (input.level === 'mid')
    return `${role} with practical experience shipping and maintaining production software.${stack} Focuses on clean, testable code and clear documentation.${goalLine}`;
  const openers = [
    `Entry-level ${role} with project experience across the full build-test-ship cycle`,
    `Aspiring ${role} who learns by building — coursework and personal projects cover the whole stack`,
    `Fresher ${role} with a build-first approach to learning modern tooling`
  ];
  return `${openers[v % openers.length]}.${stack} Writes readable code, documents decisions and picks up new tools quickly.${goalLine}`;
}

const WEAK_TO_STRONG = [
  [/^worked\s+on\s+/i,'Developed '],[/^responsible\s+for\s+/i,'Owned '],[/^was\s+responsible\s+for\s+/i,'Owned '],
  [/^helped\s+(with|to|in)?\s*/i,'Contributed to '],[/^involved\s+in\s+/i,'Drove '],[/^was\s+part\s+of\s+/i,'Contributed to '],
  [/^participated\s+in\s+/i,'Drove '],[/^assisted\s+(in|with)?\s*/i,'Supported '],[/^made\s+/i,'Built '],
  [/^did\s+/i,'Executed '],[/^handled\s+/i,'Managed ']
];
const ENRICHMENTS = [
  [/website|web\s?app|web\s?application|frontend|front-end|landing\s?page/i, ', delivering a responsive, component-driven interface with optimised frontend performance'],
  [/\bapi|backend|back-end|server/i, ', following REST conventions with consistent validation and error handling'],
  [/database|mongo|sql|postgres|schema/i, ', with attention to query performance and clean data modelling'],
  [/test|qa|bug|defect/i, ', raising reliability with repeatable regression coverage'],
  [/dashboard|chart|visuali[sz]ation|report/i, ', turning raw data into decisions with clear, real-time views']
];
function improveBullet(line){
  let s = line.replace(/^\s*([-•*–▪◦]|\d+\.)\s*/,'').trim().replace(/\s+/g,' ');
  let rewritten = false;
  for (const [rx, strong] of WEAK_TO_STRONG){ if (rx.test(s)){ s = s.replace(rx, strong); rewritten = true; break; } }
  s = s.charAt(0).toUpperCase() + s.slice(1);
  if (!/[.!?]$/.test(s)) s += '.';
  const hasNumber = /\d/.test(s);
  const enrich = ENRICHMENTS.find(([rx]) => rx.test(s));
  if (enrich) s = s.replace(/\.$/,'') + enrich[1] + '.';
  else if (!rewritten && !hasNumber) s = s.replace(/\.$/,'') + ', end to end.';
  if (!hasNumber) s = s.replace(/\.$/,'') + ' [add a real metric: %, users, time saved].';
  return s;
}

function buildAnalysis(input){
  const text = input.resumeText, lower = text.toLowerCase();
  const parsed = parseResume(text);
  const jd = (input.jobDescription || '').trim();
  const role = input.jobRole.trim();
  const roleSkills = ROLE_LIBRARY[role.toLowerCase()] || [];
  const wc = parsed.wordCount, bullets = parsed.bulletLines, quantified = parsed.quantified;
  const verbCount = bullets.filter(b => ACTION_VERBS.some(v => b.trim().toLowerCase().startsWith(v))).length;
  const verbRatio = bullets.length ? verbCount / bullets.length : 0;
  const quantRatio = bullets.length ? quantified.length / bullets.length : 0;
  const years = parsed.years;
  const certs = (parsed.sections.certifications || '').split(/\r?\n/).filter(l => l.trim().length > 6).length;
  const hasDegree = DEGREE_RX.test(text);

  const jdSkills = jd ? KNOWN_SKILLS.filter(s => hasSkill(jd, s)) : [];
  const expectedSkills = dedupe([...roleSkills, ...jdSkills]);
  const matchingSkills = expectedSkills.filter(s => hasSkill(text, s));
  const missingSkills = expectedSkills.filter(s => !hasSkill(text, s));
  const skillMatchPercent = expectedSkills.length ? Math.round(100 * matchingSkills.length / expectedSkills.length) : 70;
  const skillScore = clamp(skillMatchPercent + (parsed.sections.skills ? 4 : 0));

  const jdKeywords = jd ? extractTopWords(jd, 22) : [];
  const keywordUniverse = dedupe([...roleSkills.slice(0,14), ...jdKeywords]).slice(0, 32);
  const matchingKeywords = keywordUniverse.filter(k => lower.includes(k));
  const missingKeywords = keywordUniverse.filter(k => !lower.includes(k));
  const keywordScore = keywordUniverse.length ? Math.round(100 * matchingKeywords.length / keywordUniverse.length) : 65;
  const recommendedKeywords = dedupe(missingSkills.filter(s => roleSkills.includes(s))).slice(0, 5);

  const coreSections = ['skills','experience','education'].filter(s => parsed.sections[s] !== undefined);
  const lengthScore = wc >= 350 && wc <= 950 ? 20 : wc >= 250 && wc <= 1150 ? 12 : 5;
  const pipes = (text.match(/\|/g) || []).length;
  const formattingScore = clamp(
    coreSections.length*10 + (parsed.sections.summary?7:0) +
    (parsed.sections.projects || parsed.sections.achievements || parsed.sections.certifications ? 7 : 0) +
    lengthScore + Math.min(15, bullets.length*1.8) + (years.length?8:0) +
    (parsed.contact.email && parsed.contact.phone ? 8 : 0) - Math.min(10, pipes*2));
  const experienceScore = clamp(25 + Math.min(35, bullets.length*4) + quantRatio*25 + verbRatio*15 +
    (years.length >= 2 ? 10 : years.length ? 5 : 0));
  const educationScore = clamp((hasDegree?80:parsed.sections.education?55:35) +
    (/gpa|cgpa|percentage/i.test(text)?6:0) + (years.length?6:0) +
    (hasDegree && /b\.?\s?tech|m\.?\s?tech|bachelor|master|computer|information|science/i.test(parsed.sections.education||'')?8:0));
  const achievementScore = clamp(35 + quantified.length*7 + certs*10 +
    ((text.match(/winner|won|award|rank|scholar|gold|top\s/gi)||[]).length*6));
  const roleWords = role.toLowerCase().split(/\s+/).filter(w => w.length > 3 && !STOPWORDS.has(w));
  const roleWordsFound = roleWords.length ? roleWords.every(w => lower.includes(w)) : false;
  const jobRelevance = clamp(0.5*keywordScore + 0.35*skillScore + 0.15*(roleWordsFound?100:55));
  const overallScore = clamp(0.16*formattingScore + 0.2*keywordScore + 0.2*skillScore + 0.2*experienceScore +
    0.09*educationScore + 0.07*achievementScore + 0.08*jobRelevance);
  const contactScore = (parsed.contact.email?25:0)+(parsed.contact.phone?25:0)+(parsed.contact.linkedin?25:0)+(parsed.contact.github?25:0);
  const atsScore = clamp(0.55*formattingScore + 0.2*keywordScore + 0.15*skillScore + 0.1*contactScore);
  const atsVerdict = atsScore >= 85 ? 'Excellent' : atsScore >= 65 ? 'Good' : 'Needs Improvement';
  const fileType = input.fileType || 'pdf';
  const emojiCount = (text.match(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu) || []).length;

  const atsChecks = [
    { name:'Standard section headings', status: coreSections.length>=2?'pass':coreSections.length===1?'warn':'fail',
      detail:`${Object.keys(parsed.sections).length} standard heading(s) recognised (of summary, skills, experience, education, projects, certifications, achievements). Conventional headings let ATS software map your content correctly.` },
    { name:'Contact information', status: parsed.contact.email&&parsed.contact.phone?'pass':(parsed.contact.email||parsed.contact.phone)?'warn':'fail',
      detail:`${[parsed.contact.email&&'email',parsed.contact.phone&&'phone',parsed.contact.linkedin&&'LinkedIn',parsed.contact.github&&'GitHub'].filter(Boolean).join(', ')||'none found'} — ATS systems use these fields to index your profile, so they must be plain text, not inside headers or images.` },
    { name:'Resume length', status: wc>=350&&wc<=950?'pass':'warn',
      detail:`~${wc} words extracted. The sweet spot for a 1–2 page resume is roughly 350–950 words.` },
    { name:'File format', status: fileType==='pdf'?'pass':fileType==='docx'?'warn':'fail',
      detail: fileType==='pdf' ? 'PDF preserves layout and parses reliably in most ATS.' :
        fileType==='docx' ? 'DOCX usually parses well, but some older ATS choke on it — prefer PDF when a posting accepts it.' :
        'TXT loses all formatting and structure. Export your resume to PDF before applying.' },
    { name:'Keyword optimization', status: keywordScore>=60?'pass':keywordScore>=40?'warn':'fail',
      detail:`${matchingKeywords.length} of ${keywordUniverse.length} target keywords found. Keyword coverage is the single strongest lever on your ATS score.` },
    { name:'Tables & columns', status: pipes<=3?'pass':'warn',
      detail: pipes>3 ? `Detected ${pipes} column/table separators ("|"). Many ATS read tables left-to-right and scramble the content — prefer single-column layouts.` : 'No table-like structures detected in the extracted text.' },
    { name:'Special characters', status: emojiCount===0?'pass':'warn',
      detail: emojiCount===0 ? 'No emojis or symbols that could confuse older parsers.' : `${emojiCount} decorative symbol(s)/emoji found — some ATS replace them with unreadable characters.` },
    { name:'Graphics & images', status:'warn',
      detail:'Images cannot be detected once text is extracted — make sure no essential text (job titles, skills, contact details) lives inside icons, charts or images.' },
    { name:'Dates & chronology', status: years.length>=2?'pass':'warn',
      detail: years.length ? `${years.length} year references found — ATS and recruiters expect clear employment and education timelines.` : 'No dates detected. Add start–end years for every role and degree.' }
  ];

  const strengths = [];
  const addS = (t,d) => strengths.push({title:t, detail:d});
  if (quantified.length >= 2) addS('Measurable impact', `${quantified.length} bullet points contain numbers. Recruiters consistently rank quantified results among the strongest resume signals — for example: “${quantified[0].trim().slice(0,90)}”.`);
  if (skillScore >= 70) addS('Strong technical foundation', `${matchingSkills.length} of ${expectedSkills.length} skills expected for a ${role} role are already on your resume${matchingSkills.length?`, including ${matchingSkills.slice(0,5).join(', ')}`:''}. This is the biggest driver of ATS keyword matches.`);
  if (parsed.sections.projects) addS('Project evidence','A dedicated projects section demonstrates applied skills beyond job titles — especially valuable for students and freshers.');
  if (verbRatio >= 0.5 && bullets.length >= 3) addS('Action-oriented phrasing', `${verbCount} of ${bullets.length} bullets start with strong action verbs, which both ATS keyword scanners and human recruiters reward.`);
  if (certs) addS('Relevant certifications', `${certs} certification(s) detected. Credentials in or adjacent to the target role add verified proof of skill.`);
  if (educationScore >= 78) addS('Solid education signal','Your degree, field and timeline are stated in standard formats that ATS parsers read without errors.');
  if (contactScore >= 75) addS('Complete, parseable contact block','Email, phone and profile links are all present in plain text — ATS systems can index you correctly.');
  if (strengths.length < 3 && coreSections.length >= 2) addS('Recognisable structure','Core sections (skills, experience, education) use conventional headings, so ATS software can map your resume correctly.');

  const weaknesses = [];
  const addW = (t,d,fix) => weaknesses.push({title:t, detail:d, fix});
  const summaryText = (parsed.sections.summary || '').trim();
  const summaryWords = summaryText ? summaryText.split(/\s+/).length : 0;
  const cliches = (summaryText.match(/passionate|hard\s?working|team player|detail[- ]oriented|dedicated|self[- ]motivated|quick learner/gi) || []).length;
  if (!summaryText) addW('No professional summary','Your resume has no summary section — recruiters spend ~7 seconds on a first pass and expect a positioning statement at the very top.','Add 2–3 lines: who you are (target role), your 3–4 strongest skills, and one proof point. The Summary Generator in the Improve tab writes a draft for you.');
  else if (summaryWords < 25 || cliches) addW('Summary is too generic', `The current summary ${cliches?'uses filler language (“passionate”, “team player” style) ':'is too short to position you '} for the ${role} role.`,'Lead with role + years + stack, e.g. “Full-stack developer with React/Node.js experience…”. Avoid personality adjectives — show evidence instead.');
  if (missingKeywords.length >= 8) addW('Thin keyword coverage against the target role', `${missingKeywords.length} keywords that matter for ${role} are missing from your resume, including: ${missingKeywords.slice(0,6).join(', ')}.`,'Add keywords only where they are genuinely true for you — weave them into experience bullets and projects, never as a keyword dump.');
  if (bullets.length >= 3 && quantRatio < 0.3) addW('Achievements lack measurable impact', `${bullets.length - quantified.length} of ${bullets.length} bullets describe tasks with no numbers. Task-based bullets read like a job description, not a track record.`,'For each bullet ask: how much, how many, how long, or what changed? Even rough metrics (“~200 users”, “cut load time by 30%”) transform credibility.');
  if (missingSkills.length) addW(`Skill gaps vs ${role}`, `Missing: ${missingSkills.slice(0,5).join(', ')}${missingSkills.length>5?` (+${missingSkills.length-5} more)`:''}.`,'Shortlist 1–2 gaps you can honestly close with a focused project or coursework, then list them. Never claim skills you cannot discuss in an interview.');
  if (bullets.length >= 3 && verbRatio < 0.4) addW('Passive, duty-based phrasing','Bullets open with weak constructions like “worked on”, “responsible for” or “helped with”, which dilute ownership.','Start bullets with strong verbs — Built, Led, Developed, Reduced — then keep the rest of the line. Try the Bullet Improver in the Improve tab.');
  if (!parsed.sections.achievements && !certs) addW('No achievements or credentials section','There is no record of awards, ranks or certifications — the fastest-reading proof points on a resume.','Add a short “Achievements & Certifications” section with 2–3 concrete items (hackathon ranks, course certificates, scholarships).');
  if (wc < 250) addW('Resume is very thin', `Only ~${wc} words were extracted — under one page. Thin resumes give ATS and recruiters too little signal to rank you.`,'Expand experience bullets and projects with technologies used, your specific contribution, and outcomes.');
  else if (wc > 1100) addW('Resume is too long', `~${wc} words extracted — beyond the 1–2 pages recruiters expect.`,'Cut roles older than ~8 years, merge overlapping projects, and keep only bullets relevant to the target role.');

  const companyFit = getCompanyShortlistDetails(text, role, jd);
  const selectionProbability = clamp(Math.round((overallScore * 0.50) + (companyFit.fitScore * 0.35) + (jobRelevance * 0.15)));
  const salaryRange = estimateSalary(role, selectionProbability, Math.max(1, years.length || 1), companyFit.company);

  const suggestions = [{
    section:'Summary',
    current: summaryText || '(No summary found — your resume currently opens without a positioning statement.)',
    improved: generateSummary({ targetJob:role, level:inferLevel(years), skills:matchingSkills.slice(0,5), goals:'' }),
    why:'Recruiters read the summary first. Lead with the target role, your core stack and one proof point — in that order.'
  }];
  const weakBullets = bullets
    .map(b => ({ b, score: (WEAK_TO_STRONG.some(([rx]) => rx.test(b.trim())) ? 2 : 0) + (/\d/.test(b) ? 0 : 1) }))
    .filter(x => x.score >= 1).sort((a,b2) => b2.score - a.score).slice(0, 3);
  for (const { b } of weakBullets){
    suggestions.push({ section:'Experience', current: b.trim(), improved: improveBullet(b),
      why:'Strong verbs plus scope turn a duty into an achievement (Action + Task + Technology + Result). Replace the bracketed placeholder with a real number — never invent metrics.' });
  }
  if (!parsed.sections.projects){
    suggestions.push({ section:'Projects', current:'(No projects section.)',
      improved:'PROJECTS\n<Project name> — <main technologies>\n- Built <what it does>, covering <your specific contribution> and [outcome: users, performance, grade].',
      why:'For early-career candidates, projects often outweigh experience. Replace every placeholder with your real work.' });
  }

  const sectionAnalysis = {
    summary: { present: !!summaryText, wordCount: summaryWords,
      score: clamp((summaryText?60:30) + Math.min(25, summaryWords/2) - cliches*8),
      note: !summaryText ? 'No summary section detected. Recruiters expect a 2–3 line positioning statement at the top.'
        : summaryWords < 25 ? 'The summary is too short to position you — aim for 30–60 words covering role, stack and proof.'
        : cliches ? 'The summary leans on clichés. Replace with concrete role + stack + outcomes.'
        : 'The summary is present and substantive.' },
    experience: { present: !!parsed.sections.experience, bullets: bullets.length, quantified: quantified.length, score: experienceScore,
      note: bullets.length < 5 ? 'Fewer than 5 achievement bullets — thin evidence for recruiters scanning quickly.'
        : quantRatio < 0.3 ? 'Bullets describe tasks rather than outcomes — fewer than a third include a number.'
        : 'Solid experience section with quantified results.' },
    education: { present: !!parsed.sections.education, score: educationScore,
      note: hasDegree ? 'Degree, field and timeline are clearly stated — ATS parses this reliably.'
        : 'No degree keyword detected. If you have one, write it in a standard format (e.g., “B.Tech in Computer Science”).' },
    skills: { present: !!parsed.sections.skills, matched: matchingSkills.length, score: skillScore,
      note: parsed.sections.skills ? `Skills section found with ${matchingSkills.length} role-relevant skills matched.`
        : 'No dedicated skills section — ATS keyword scanners look for a clearly labelled “Skills” block.' },
    projects: { present: !!parsed.sections.projects, score: clamp(60 + Math.min(40,
      (parsed.sections.projects||'').split(/\r?\n/).filter(l => l.trim().length > 10).length*8)),
      note: parsed.sections.projects ? 'Projects give junior candidates the strongest evidence of applied skill — keep the 2 most relevant ones at the top.'
        : 'No projects section. For early-career candidates, projects often outweigh experience.' }
  };

  return {
    overallScore, atsScore, skillScore, keywordScore, formattingScore, experienceScore,
    educationScore, achievementScore, jobMatchScore: jobRelevance, skillMatchPercent,
    atsVerdict, atsChecks, strengths: strengths.slice(0,5), weaknesses: weaknesses.slice(0,5),
    matchingKeywords, missingKeywords, recommendedKeywords,
    matchingSkills, missingSkills, skillGaps: missingSkills.slice(0,8),
    suggestions: suggestions.slice(0,4), sectionAnalysis,
    companyFit,
    selectionProbability,
    salaryRange,
    source: 'engine'
  };
}

function analyseJobMatch(resumeText, jd){
  const text = resumeText, lower = text.toLowerCase();
  const parsed = parseResume(text);
  const roleKey = detectRole(jd);
  const expectedSkills = dedupe([...(roleKey ? ROLE_LIBRARY[roleKey] : []), ...KNOWN_SKILLS.filter(s => hasSkill(jd, s))]);
  const matchingSkills = expectedSkills.filter(s => hasSkill(text, s));
  const missingSkills = expectedSkills.filter(s => !hasSkill(text, s));
  const skillsMatch = expectedSkills.length ? Math.round(100*matchingSkills.length/expectedSkills.length) : 60;
  const jdKeywords = extractTopWords(jd, 20).filter(k => k.length > 3);
  const keywordMatch = jdKeywords.length ? Math.round(100*jdKeywords.filter(k => lower.includes(k)).length/jdKeywords.length) : 60;
  const requiredYears = Number((jd.match(/(\d+)\+?\s*years?/i) || [])[1] || 0);
  const spanYears = parsed.years.length ? Math.min(12, Math.max(...parsed.years) - Math.min(...parsed.years)) : 0;
  const experienceMatch = requiredYears ? clamp(100*Math.min(1,(spanYears||2)/requiredYears))
    : clamp(60 + Math.min(35, parsed.bulletLines.length*4) + parsed.quantified.length*3);
  const jdWantsDegree = /bachelor|master|b\.?tech|b\.?sc|m\.?sc|degree/i.test(jd);
  const hasDegree = DEGREE_RX.test(text);
  const educationMatch = jdWantsDegree ? (hasDegree ? 90 : 40) : 75;
  const roleKeyFound = roleKey ? roleKey.split(' ').every(w => lower.includes(w)) : false;
  const roleRelevance = clamp((roleKeyFound?80:40) + Math.round(keywordMatch*0.2));
  const matchScore = clamp(Math.round(0.35*skillsMatch + 0.25*keywordMatch + 0.2*experienceMatch + 0.1*educationMatch + 0.1*roleRelevance));
  const missingRequirements = [];
  for (const rawLine of jd.split(/\r?\n/)){
    const line = rawLine.replace(/^[-•*\d.)\s]+/,'').trim();
    if (line.length < 12 || line.length > 150) continue;
    if (missingSkills.some(s => hasSkill(line, s)) && !missingRequirements.includes(line)) missingRequirements.push(line);
    if (missingRequirements.length >= 6) break;
  }
  const recommendedImprovements = [];
  if (missingSkills.length) recommendedImprovements.push(`Close the top skill gaps first — prioritise ${missingSkills.slice(0,3).join(', ')}, since they appear as explicit requirements in this posting.`);
  if (keywordMatch < 60) recommendedImprovements.push(`Mirror the job's language: ${jdKeywords.filter(k => !lower.includes(k)).slice(0,5).join(', ')} appear in the posting but not your resume. Add them only where they are genuinely true.`);
  if (requiredYears && experienceMatch < 70) recommendedImprovements.push(`This posting asks for ${requiredYears}+ years. Lead with your longest, most relevant engagement and quantify scope to offset a shorter history.`);
  if (jdWantsDegree && !hasDegree) recommendedImprovements.push('The posting lists a degree requirement. If you have one, state it in a standard “B.Tech in Computer Science” format so both ATS and recruiters see it.');
  if (parsed.quantified.length < 2) recommendedImprovements.push('Quantify 2–3 bullets with real numbers (%, users, time saved). Match rates jump when outcomes, not duties, are visible.');
  return {
    matchScore,
    breakdown: [
      { label:'Skills', score:skillsMatch }, { label:'Experience', score:experienceMatch },
      { label:'Education', score:educationMatch }, { label:'Keywords', score:keywordMatch },
      { label:'Role relevance', score:roleRelevance }
    ],
    topMatchingSkills: matchingSkills.slice(0,8), missingRequirements, recommendedImprovements
  };
}

function getCompanyProfileForRole(role, jd = ''){
  const seed = `${(role || 'software developer')}|${(jd || '').toLowerCase()}`;
  const idx = hashString(seed) % COMPANY_PROFILES.length;
  return COMPANY_PROFILES[idx];
}

function estimateSalary(role, score, years, companyProfile){
  const base = {
    'software developer': 11,
    'full stack developer': 14,
    'web developer': 10,
    'data analyst': 9,
    'data scientist': 15,
    'ai/ml engineer': 17,
    'cloud engineer': 16,
    'cybersecurity analyst': 14,
    'business analyst': 10,
    'product manager': 16,
    'ui/ux designer': 10,
    'developer': 11
  };
  const r = (role || '').toLowerCase();
  const baseSalary = base[r] || base.developer;
  const yearsBoost = Math.max(0, (years || 1) - 1) * 1.4;
  const scoreBoost = ((score || 60) - 55) * 0.18;
  const min = Math.max(7, Math.round((baseSalary + yearsBoost + companyProfile.salary.min * 0.75 + scoreBoost) * 10) / 10);
  const max = Math.max(min + 3, Math.round((baseSalary + yearsBoost + companyProfile.salary.max * 0.9 + scoreBoost) * 10) / 10);
  return { min, max, label: `${min}L - ${max}L ${companyProfile.salary.unit}` };
}

function getCompanyShortlistDetails(resumeText, role, jd = ''){
  const company = getCompanyProfileForRole(role, jd);
  const lower = (resumeText || '').toLowerCase();
  const companyKeywords = dedupe([...company.keywords, ...company.requiredSkills]).slice(0, 18);
  const matched = companyKeywords.filter(k => lower.includes(k.toLowerCase()));
  const missing = companyKeywords.filter(k => !lower.includes(k.toLowerCase()));
  const fitScore = companyKeywords.length ? clamp(Math.round((matched.length / companyKeywords.length) * 100)) : 72;
  const shortlistStatus = fitScore >= 75 ? 'Strong shortlist fit' : fitScore >= 60 ? 'Moderate shortlist fit' : 'Needs more alignment';
  return {
    company,
    fitScore,
    shortlistStatus,
    matched,
    missing,
    criteria: companyKeywords.map(k => ({
      keyword: k,
      matched: lower.includes(k.toLowerCase())
    }))
  };
}

function hashString(str){
  let h = 2166136261;
  for (let i = 0; i < str.length; i++){
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return Math.abs(h >>> 0);
}

/* ---------------- UI components ---------------- */
function toast(msg, type='info'){
  let wrap = $('#toasts');
  if (!wrap){ wrap = document.createElement('div'); wrap.id = 'toasts'; document.body.appendChild(wrap); }
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.setAttribute('role','status');
  el.innerHTML = `<i data-lucide="${type==='ok'?'check-circle-2':type==='error'?'alert-triangle':'info'}" class="ic4"></i><span>${esc(msg)}</span>`;
  wrap.appendChild(el); icons();
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 260); }, 4200);
}
function confirmDialog({ title, desc, yes='Delete', onYes }){
  const ov = document.createElement('div'); ov.className = 'overlay';
  ov.innerHTML = `<div class="modal card"><h3>${esc(title)}</h3><p>${esc(desc)}</p>
    <div class="row-end"><button class="btn outline sm" data-act="no">Cancel</button>
    <button class="btn danger sm" data-act="yes">${esc(yes)}</button></div></div>`;
  document.body.appendChild(ov);
  ov.addEventListener('click', e => {
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (act === 'yes'){ ov.remove(); onYes(); }
    else if (act === 'no' || e.target === ov) ov.remove();
  });
}
function ringSvg(score, size=120, label=''){
  const t = 9, r = (size - t*2)/2 - 2, C = 2*Math.PI*r;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" data-ring="${score}" role="img" aria-label="${esc(label)} ${score} of 100">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${t}"/>
    <circle class="ring-fg" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${scoreColor(score)}" stroke-width="${t}"
      stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${C.toFixed(1)}" transform="rotate(-90 ${size/2} ${size/2})"/>
    <text x="50%" y="50%" text-anchor="middle" dominant-baseline="middle" fill="var(--ink)" font-size="${(size/4.2).toFixed(0)}" font-weight="600" class="mono tnum ring-num">0</text>
    ${label?`<text x="50%" y="70%" text-anchor="middle" dominant-baseline="middle" fill="var(--faint)" font-size="${(size/11).toFixed(0)}" class="mono" style="text-transform:uppercase;letter-spacing:.15em">${esc(label)}</text>`:''}
  </svg>`;
}
function animateRing(svg, target, dur=900){
  const fg = svg.querySelector('.ring-fg'), num = svg.querySelector('.ring-num');
  if (!fg) return;
  const C = +fg.getAttribute('stroke-dasharray');
  const from = num ? (+num.textContent || 0) : 0;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches){
    fg.style.strokeDashoffset = C*(1-target/100); if (num) num.textContent = target; return;
  }
  const start = performance.now();
  (function tick(t){
    const p = Math.min(1,(t-start)/dur), e = 1-Math.pow(1-p,3);
    const val = Math.round(from + (target-from)*e);
    if (num) num.textContent = val;
    fg.style.strokeDashoffset = C*(1-val/100);
    if (p < 1) requestAnimationFrame(tick);
  })(start);
}
function animateRings(root=document){ root.querySelectorAll('svg[data-ring]').forEach(svg => animateRing(svg, +svg.dataset.ring)); }
function lineChartSvg(data){
  const n = data.length;
  if (n < 2) return '<p class="empty-note">Run at least two analyses to see your trend.</p>';
  const W=640, H=210, px=36, py=28;
  const x = i => px + i*(W-px*2)/(n-1);
  const y = v => H-py - v*(H-py*2)/100;
  const grid = [0,50,100].map(v => `<line x1="${px}" x2="${W-px}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--line)" stroke-dasharray="3 6"/>`).join('');
  const pts = data.map((d,i) => `${x(i).toFixed(1)},${y(d.score).toFixed(1)}`).join(' ');
  const dots = data.map((d,i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(d.score).toFixed(1)}" r="4" fill="var(--accent)"><title>${esc(d.date)} — ${d.score} · ${esc(d.label)}</title></circle>`).join('');
  const labs = [0, Math.floor((n-1)/2), n-1].map(i => `<text x="${x(i).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--faint)" class="mono">${esc(data[i].date)}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${grid}<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>${dots}${labs}</svg>`;
}
function radarSvg(items){
  const cx=170, cy=140, R=92, n=items.length;
  const ang = i => -Math.PI/2 + i*2*Math.PI/n;
  const P = (i,f) => `${(cx+Math.cos(ang(i))*R*f).toFixed(1)},${(cy+Math.sin(ang(i))*R*f).toFixed(1)}`;
  const rings = [0.33,0.66,1].map(f => `<polygon points="${items.map((_,i)=>P(i,f)).join(' ')}" fill="none" stroke="var(--line)"/>`).join('');
  const axes = items.map((_,i) => { const [x,y] = P(i,1).split(','); return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/>`; }).join('');
  const poly = `<polygon points="${items.map((it,i)=>P(i,it.value/100)).join(' ')}" fill="var(--accent)" fill-opacity="0.18" stroke="var(--accent)" stroke-width="2"/>`;
  const labs = items.map((it,i) => { const [x,y] = P(i,1.2).split(','); return `<text x="${x}" y="${(+y+3).toFixed(1)}" text-anchor="middle" font-size="9" fill="var(--faint)" class="mono">${esc(it.axis)}</text>`; }).join('');
  return `<svg viewBox="0 0 340 280" style="width:100%;max-width:420px;height:auto;display:block;margin:auto">${rings}${axes}${poly}${labs}</svg>`;
}

if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
async function extractFileText(f, onStatus){
  const ext = f.name.split('.').pop().toLowerCase();
  if (ext === 'pdf'){
    if (!window.pdfjsLib) throw new Error('PDF reader failed to load — check your internet connection and refresh.');
    onStatus('Reading PDF…');
    const pdf = await pdfjsLib.getDocument({ data: await f.arrayBuffer() }).promise;
    let text = '';
    for (let i = 1; i <= pdf.numPages; i++){
      onStatus(`Extracting text — page ${i}/${pdf.numPages}`);
      const page = await pdf.getPage(i);
      const tc = await page.getTextContent();
      text += tc.items.map(x => x.str).join(' ') + '\n';
    }
    return text;
  }
  if (ext === 'docx' || ext === 'doc' || ext === 'rtf' || ext === 'odt' || ext === 'txt'){
    if (ext === 'docx'){
      if (!window.mammoth) throw new Error('DOCX reader failed to load — check your internet connection and refresh.');
      onStatus('Reading DOCX…');
      const r = await mammoth.extractRawText({ arrayBuffer: await f.arrayBuffer() });
      return r.value;
    }
    onStatus('Reading document…');
    try {
      const text = await f.text();
      if (text && text.trim().length > 20) return text;
    } catch {}
    try {
      return new TextDecoder('utf-8', { fatal: false }).decode(await f.arrayBuffer());
    } catch {
      return '';
    }
  }
  onStatus('Reading text…');
  return await f.text();
}

function buildAiReply(question) {
  const q = (question || '').toLowerCase().trim();
  if (!q) return 'Ask me anything about resumes, ATS, job roles, or career growth.';

  const roleHint = (() => {
    const patterns = [
      'data analyst', 'software engineer', 'product manager', 'frontend developer',
      'backend developer', 'full stack developer', 'ui/ux designer', 'data scientist',
      'marketing manager', 'sales executive', 'project manager', 'business analyst'
    ];
    const match = patterns.find(term => q.includes(term));
    return match || 'your target role';
  })();

  const pick = (items) => items[Math.floor(Math.random() * items.length)];

  if (q.includes('resume') || q.includes('cv') || q.includes('ats')) {
    const replies = [
      `For a strong resume, keep the format simple, match the wording of the job description, and add measurable wins. The fastest upgrade is usually a tighter summary and more result-driven bullets for ${roleHint}.`,
      'A recruiter-friendly resume is clear, keyword-aligned, and outcome-driven. Remove vague responsibilities and replace them with concrete impact, numbers, and role-specific proof.',
      'The best ATS resumes feel easy to scan. Use standard headings, mirror the job language naturally, and let your experience show what changed because of your work.'
    ];
    return pick(replies);
  }

  if (q.includes('salary') || q.includes('pay') || q.includes('package') || q.includes('compensation')) {
    const replies = [
      'Salary usually depends on experience level, role, location, and how strongly your resume proves value. The stronger your evidence, the stronger your negotiation position.',
      'A realistic pay range comes from market data plus proof of impact. If your resume shows measurable outcomes and the right keywords, you usually have more leverage in salary talks.',
      'The right compensation story is built from scope, seniority, and results. Make your profile read like a high-impact candidate and the numbers become easier to justify.'
    ];
    return pick(replies);
  }

  if (q.includes('skill') || q.includes('gap') || q.includes('improve') || q.includes('missing') || q.includes('weak')) {
    const replies = [
      `Target the top 2–3 skills from the job description and build proof around them. A focused improvement plan is stronger than listing every possible keyword you do not actually use for ${roleHint}.`,
      'Improve the skills that matter most to the role, then show them through examples, projects, and clear impact. That is how you turn a gap into a credible strength.',
      'The most effective skill upgrade is practical: learn the core requirement, apply it in a project, and then reflect that work clearly in your resume and interview stories.'
    ];
    return pick(replies);
  }

  if (q.includes('interview') || q.includes('offer')) {
    const replies = [
      'Prepare three stories: leadership, problem-solving, and teamwork. Keep each answer structured around the challenge, your actions, and the measurable outcome.',
      'Strong interview answers are concrete and brief. Explain the business problem, what you did, and why it mattered in terms of time, revenue, quality, or customer value.',
      'Use STAR, but make it sound natural. Recruiters care less about the format and more about whether your examples show judgment, ownership, and impact.'
    ];
    return pick(replies);
  }

  if (q.includes('job') || q.includes('role') || q.includes('career')) {
    const replies = [
      `Start with the target role and map your experience to the problems the employer is trying to solve. Then turn your strongest examples into clear, outcome-based language for ${roleHint}.`,
      'The strongest answer usually combines role-specific tailoring with proof. Show what you built, what changed, and how it connects to the job requirement.',
      'A useful strategy is to anchor your response in the job description, highlight the most relevant wins, and remove anything that dilutes your fit with the role.'
    ];
    return pick(replies);
  }

  if (q.includes('hello') || q.includes('hi') || q.includes('hey') || q.includes('good morning') || q.includes('good evening')) {
    const replies = [
      'Hello! I can help you sharpen your resume, improve ATS fit, and plan the next best move for your target role.',
      'Hi there — I can review your resume, identify what is missing, and suggest practical improvements based on the role you want.',
      'Welcome! Tell me the role, your experience, and the gap you want to improve, and I will help you plan a stronger application.'
    ];
    return pick(replies);
  }

  const generalReplies = [
    `Start with the target role and map your experience to the problems the employer is trying to solve. Then turn your strongest examples into clear, outcome-based language for ${roleHint}.`,
    'The strongest answer usually combines role-specific tailoring with proof. Show what you built, what changed, and how it connects to the job requirement.',
    'A useful strategy is to anchor your response in the job description, highlight the most relevant wins, and remove anything that dilutes your fit with the role.'
  ];
  return pick(generalReplies);
}

function ensureAiChatWidget() {

  widget.className = 'floating-ai-chat hidden';

        <input id="floatingAiChatInput" type="text" placeholder="Ask the AI coach..." autocomplete="off" />
        <button class="btn" type="submit">Send</button>
      </form>
    </div>`;

  const chatWindow = widget.querySelector('#floatingAiChatWindow');
  const chatForm = widget.querySelector('#floatingAiChatForm');
  const chatInput = widget.querySelector('#floatingAiChatInput');

  const addMessage = (text, who='bot') => {
    const msg = document.createElement('div');
    msg.className = `chat-msg ${who}`;
    msg.textContent = text;
    chatWindow.appendChild(msg);
    chatWindow.scrollTop = chatWindow.scrollHeight;
  };

  saveAiChatHistory([]);
  renderAiChatHistory(chatWindow, []);

  widget.querySelector('#floatingAiClose').onclick = () => {
    widget.classList.add('hidden');
    widget.classList.remove('minimized');
    widget.classList.remove('maximized');
  };

  widget.querySelector('#floatingAiMinimize').onclick = () => {
    const isMinimized = widget.classList.toggle('minimized');
    widget.classList.remove('maximized');
    const body = widget.querySelector('#floatingAiBody');
    body.style.display = isMinimized ? 'none' : 'flex';

    body.style.display = 'flex';
  };

  chatForm.onsubmit = async (e) => {
    e.preventDefault();
    const question = chatInput.value.trim();
    if (!question) return;
    const replyText = buildAiReply(question);
    const nextHistory = [...getAiChatHistory(), { role: 'user', text: question }, { role: 'bot', text: replyText }];
    saveAiChatHistory(nextHistory);
    addMessage(question, 'user');
    chatInput.value = '';
    const btn = chatForm.querySelector('button');
    btn.disabled = true;
    btn.textContent = '…';
    try {
      const response = await fetch('http://localhost:5000/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question })
      });
      const finalReply = response.ok ? (await response.json()).reply || replyText : replyText;
      const history = getAiChatHistory();
      const latest = history.length ? history[history.length - 1] : null;
      if (latest && latest.role === 'bot' && latest.text === replyText) {
        const updated = [...history.slice(0, -1), { role: 'bot', text: finalReply }];
        saveAiChatHistory(updated);
      } else {
        saveAiChatHistory([...history, { role: 'bot', text: finalReply }]);
      }
      addMessage(finalReply, 'bot');
    } catch (err) {
      console.warn('AI chat backend unavailable; using local fallback:', err);
      addMessage(replyText, 'bot');
      const history = getAiChatHistory();
      const last = history[history.length - 1];
      if (last && last.role === 'bot' && last.text === replyText) {
        saveAiChatHistory(history);
      } else {
        saveAiChatHistory([...history, { role: 'bot', text: replyText }]);
      }
    } finally {
      btn.disabled = false;
      btn.textContent = 'Send';
    }
  };

  document.body.appendChild(widget);
  icons();
  return widget;
}

function openAiChatWidget(pointerEvent) {
  const widget = ensureAiChatWidget();
  widget.classList.remove('hidden');
  widget.classList.remove('minimized');
  widget.classList.remove('maximized');
  widget.style.right = 'auto';
  widget.style.bottom = 'auto';

  if (pointerEvent && typeof pointerEvent.clientX === 'number' && typeof pointerEvent.clientY === 'number') {
    const left = Math.min(Math.max(20, pointerEvent.clientX - 150), window.innerWidth - 200);
    const top = Math.min(Math.max(20, pointerEvent.clientY - 110), window.innerHeight - 220);
    widget.style.left = `${left}px`;
    widget.style.top = `${top}px`;
  } else {
    widget.style.left = 'calc(100vw - 340px)';
    widget.style.top = 'calc(100vh - 420px)';
  }

  const input = widget.querySelector('#floatingAiChatInput');
  if (input) {
    setTimeout(() => input.focus(), 60);
  }

  const header = widget.querySelector('.chat-header');
  if (header) {
    let dragInfo = null;
    header.onpointerdown = (event) => {
      if (event.target.closest('button')) return;
      dragInfo = {
        startX: event.clientX,
        startY: event.clientY,
        left: parseFloat(widget.style.left || (window.innerWidth - 380)),
        top: parseFloat(widget.style.top || (window.innerHeight - 490))
      };
      header.setPointerCapture(event.pointerId);
    };
    header.onpointermove = (event) => {
      if (!dragInfo) return;
      const dx = event.clientX - dragInfo.startX;
      const dy = event.clientY - dragInfo.startY;
      const nextLeft = Math.min(Math.max(10, dragInfo.left + dx), window.innerWidth - 260);
      const nextTop = Math.min(Math.max(10, dragInfo.top + dy), window.innerHeight - 80);
      widget.style.left = `${nextLeft}px`;
      widget.style.top = `${nextTop}px`;
    };
    header.onpointerup = () => { dragInfo = null; };
    header.onpointerleave = () => { dragInfo = null; };
  }
}

function decodeGoogleJwt(token) {
  try {
    const payload = token.split('.')[1];
    const normalized = payload.replace(/-/g, '+').replace(/_/g, '/');
    const padded = normalized + '='.repeat((4 - normalized.length % 4) % 4);
    return JSON.parse(atob(padded));
  } catch {
    return null;
  }
}

function handleGoogleCredentialResponse(response) {
  const profile = decodeGoogleJwt(response.credential);
  if (!profile) {
    toast('Google account verification failed. Please try again.', 'error');
    return;
  }
  const email = (profile.email || '').toLowerCase();
  const name = profile.name || 'Google User';
  const existing = users().find(u => u.email === email);
  const user = existing || {
    id: uid(),
    name,
    email,
    salt: uid(),
    hash: 'google-auth',
    targetJob:'',
    skills:[],
    education:'',
    createdAt: nowIso()
  };
  if (!existing) saveUsers([...users(), user]);
  setSession(user);
  toast(`Signed in with Google as ${name}.`, 'ok');
  location.hash = '#/dashboard';
}

const GOOGLE_CLIENT_ID = window.GOOGLE_CLIENT_ID || 'YOUR_GOOGLE_CLIENT_ID';

function loadGoogleIdentityScript() {
  return new Promise((resolve) => {
    if (window.google && window.google.accounts && window.google.accounts.id) {
      resolve();
      return;
    }
    const existing = document.querySelector('script[src="https://accounts.google.com/gsi/client"]');
    if (existing) {
      existing.addEventListener('load', resolve, { once: true });
      return;
    }
    const script = document.createElement('script');
    script.src = 'https://accounts.google.com/gsi/client';
    script.async = true;
    script.defer = true;
    script.onload = resolve;
    script.onerror = () => resolve();
    document.head.appendChild(script);
  });
}

async function setupGoogleAuth(buttonId) {
  const button = document.getElementById(buttonId);
  if (!button) return;

  await loadGoogleIdentityScript();

  if (!window.google || !window.google.accounts || !window.google.accounts.id) {
    button.onclick = () => toast('Google sign-in is not configured yet. Add a real Google client ID to enable account verification.', 'error');
    return;
  }

  const clientId = String(window.GOOGLE_CLIENT_ID || GOOGLE_CLIENT_ID || '').trim();
  if (!clientId || clientId.includes('YOUR_') || clientId.includes('YOUR_GOOGLE_CLIENT_ID')) {
    button.onclick = () => toast('Google account picker is disabled until a real Google client ID is added to the app.', 'error');
    return;
  }

  google.accounts.id.initialize({
    client_id: clientId,
    callback: handleGoogleCredentialResponse,
    auto_select: false,
    context: 'signin'
  });

  button.onclick = () => {
    google.accounts.id.prompt((notification) => {
      if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
        const message = 'Google account chooser was not displayed. Please make sure the Google client ID is valid and the browser is signed into Google.';
        toast(message, 'error');
      }
    });
  };
}

function generateCaptcha(){
  const ops = ['+', '-', '×'];
  const op = ops[Math.floor(Math.random() * ops.length)];
  let a = Math.floor(Math.random() * 9) + 1;
  let b = Math.floor(Math.random() * 9) + 1;
  let answer;
  if (op === '+') {
    answer = a + b;
  } else if (op === '-') {
    if (a < b) [a, b] = [b, a];
    answer = a - b;
  } else {
    answer = a * b;
  }
  return {
    op,
    expression: `${a} ${op} ${b}`,
    answer
  };
}

async function fetchBackendAnalysis(payload){
  const endpoint = 'http://localhost:5000/api/analyze';
  try {
    const response = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    if (!response.ok) {
      throw new Error(`Backend error: ${response.status}`);
    }

    const data = await response.json();
    if (!data || typeof data !== 'object') {
      throw new Error('Empty backend response');
    }

    return data;
  } catch (err) {
    console.warn('AI backend unavailable; switching to built-in analysis mode:', err);
    return buildAnalysis(payload);
  }
}

  function handleFile(f){
    try {
      if (!f || busy) return;
      const allowedName = /\.(pdf|doc|docx|rtf|txt|odt)$/i.test(f.name);
      const allowedType = /^(application\/pdf|application\/msword|application\/vnd\.openxmlformats-officedocument\.wordprocessingml\.document|application\/rtf|text\/plain|application\/vnd\.oasis\.opendocument\.text)$/i.test(f.type || '');
      if (!allowedName && !allowedType) return toast('Unsupported file type. Please upload a PDF, DOC, DOCX, TXT, RTF, or ODT resume.','error');
      if (f.size > 20*1024*1024) return toast('File too large. Maximum resume size is 20 MB.','error');

      icons();

      extractFileText(f, s => { const el = $('#exStatus'); if (el) el.textContent = s; })

          if (!text || text.replace(/\s/g,'').length < 120){
            toast('We could not extract enough text — scanned or image-only resumes can\'t be analysed. Export a text-based PDF, DOC, DOCX, TXT, RTF, or ODT file.','error');

          setLastResume(resumeRec.id);
          toast('Resume uploaded — text extracted successfully.','ok');

        .catch(ex => { busy = false; console.error('Upload parse failed:', ex); toast(ex && ex.message ? ex.message : 'Could not read this file.','error'); reset(); });

          const FLOW = ['Uploading','Extracting text','Analysing with AI','Generating insights','Complete'];
          const card = $('#flowCard'); card.style.display = '';
          card.innerHTML = `<h2>Analysis in progress</h2><ol class="flow" style="margin-top:18px" id="flowList">
            ${FLOW.map((s,i) => `<li class="${i<2?'done':i===2?'act':''}"><span class="fd">${i<2?'<i data-lucide="check" class="ic3"></i>':i===2?'<span class="spin" style="width:12px;height:12px"></span>':i+1}</span>${s}</li>`).join('')}
          </ol>`;
          icons();
          $('#runRow').style.display = 'none';
          setTimeout(() => {
            (async () => {
              try {
                const payload = { resumeText: resumeRec.text, jobRole: targetRole, jobDescription: jd, fileType: resumeRec.fileType };
                const result = await fetchBackendAnalysis(payload);
                const li = $$('#flowList li');
                li[2].className = 'done'; li[2].querySelector('.fd').innerHTML = '<i data-lucide="check" class="ic3"></i>';
                li[3].className = 'act'; li[3].querySelector('.fd').innerHTML = '<span class="spin" style="width:12px;height:12px"></span>';
                icons();
                setTimeout(() => {
                  li[3].className = 'done'; li[3].querySelector('.fd').innerHTML = '<i data-lucide="check" class="ic3"></i>';
                  li[4].className = 'done'; li[4].querySelector('.fd').innerHTML = '<i data-lucide="check" class="ic3"></i>';
                  icons();
                  const rec = { id: uid(), userId: u.id, resumeId: resumeRec.id, resumeFileName: resumeRec.fileName,
                    jobRole: targetRole, jobDescription: jd, ...result, createdAt: nowIso() };
                  saveAnalyses([...analyses(), rec]);
                  setTimeout(() => { location.hash = '#/analysis/' + rec.id; }, 550);
                }, 600);
              } catch (analysisError) {
                console.error('Analysis step crashed:', analysisError);
                toast('The analysis aborted unexpectedly. Please retry the upload and analysis flow.','error');
                reset();
              }
            })();
          }, 900);
        } catch (btnErr) {
          console.error('Run analysis button crashed:', btnErr);
          toast('The analysis flow hit an unexpected error. Please try again.','error');
          reset();
        }
      };
    } catch (err) {
      console.error('renderSteps crashed:', err);
      toast('The resume preview failed. Please try another file or re-upload the document.','error');
      reset();
    }
  }
}

/* ---------- analysis view (shared with demo) ---------- */

        <div class="overview">

              <div class="subscores">
                ${scores.map(([l,v]) => `<div class="ss"><div class="lbl"><span>${l}</span><b class="mono tnum">${v}</b></div><div class="progress"><i style="width:${v}%;background:${scoreColor(v)}"></i></div></div>`).join('')}

          <div class="card panel">
            <div class="detail-head">

            <div class="two" style="margin-top:14px">

          <div class="split-detail">

              <div class="detail-head">
                <h2><i data-lucide="check-circle-2" class="ic4" style="color:var(--success)"></i>Pros / What you are doing well</h2>

              </div>
              <ul class="detail-list">
                ${safeStrengths.length ? safeStrengths.map(s => `
                  <li>
                    <span class="bullet good">✓</span>
                    <div>
                      <strong>${esc(s.title)}</strong>
                      <p>${esc(s.detail)}</p>
                    </div>
                  </li>`).join('') : `<li><span class="bullet good">✓</span><div><strong>Strong resume structure</strong><p>We did not detect major issues in this section, and the resume still reads clearly for recruiters and ATS systems.</p></div></li>`}
              </ul>
            </div>
            <div class="card panel detail-card negative">
              <div class="detail-head">
                <h2><i data-lucide="alert-triangle" class="ic4" style="color:var(--warn)"></i>Cons / Missing things</h2>
                <span class="mini-tag">Gaps</span>
              </div>
              <ul class="detail-list">
                ${safeWeaknesses.length ? safeWeaknesses.map(w => `
                  <li>
                    <span class="bullet bad">!</span>
                    <div>
                      <strong>${esc(w.title)}</strong>
                      <p>${esc(w.detail)}</p>
                      <div class="fixbox"><b>Fix:</b> ${esc(w.fix)}</div>
                    </div>
                  </li>`).join('') : `<li><span class="bullet bad">!</span><div><strong>No major gaps found</strong><p>The resume looks balanced and is mostly aligned with the target role. Keep tracking the strongest keywords and measurable results.</p></div></li>`}
              </ul>
            </div>
          </div>
          <div>
            <h2 style="font-size:16px;margin-bottom:14px">AI improvement suggestions</h2>
            <div style="display:grid;gap:16px">
              ${safeSuggestions.length ? safeSuggestions.map((s,i) => `<div class="sugg">
                <div class="suggh"><i data-lucide="wand-2" class="ic3" style="color:var(--accent)"></i>${esc(s.section || 'AI')} suggestion
                  ${applied.includes(i) ? '<span class="badge ok" style="margin-left:auto"><i data-lucide="check" class="ic3"></i>Applied</span>' : ''}</div>
                <div class="suggb">
                  <div><p class="curlab">Current</p><p class="cur">“${esc(s.current || '')}”</p></div>
                  <div><p class="curlab" style="color:var(--accent)">AI recommendation</p><p class="imp">${esc(s.improved || '')}</p></div>
                </div>
                <div class="suggf">
                  <button class="btn outline sm" data-copy="${i}"><i data-lucide="copy" class="ic3"></i>Copy</button>
                  <button class="btn sm ${applied.includes(i)?'outline':''}" data-apply="${i}">${applied.includes(i)?'Undo apply':'Apply suggestion'}</button>

                </div>
              </div>`).join('') : '<div class="card panel"><p class="empty-note">No AI suggestions were generated for this resume yet.</p></div>'}
            </div>
          </div>
        </div>
