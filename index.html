      <div data-p="ats" hidden>
        <div class="overview">
          <div class="card scorehero">
            ${ringSvg(a.atsScore, 128, 'ATS')}
            <div class="side">
              <h2 style="font-size:17px">ATS Compatibility: <span style="color:${vTone==='ok'?'var(--success)':vTone==='acc'?'var(--accent)':'var(--danger)'}">${esc(a.atsVerdict)}</span></h2>
              <p style="margin-top:8px;max-width:480px;color:var(--muted);font-size:13.5px;line-height:1.6">ATS (Applicant Tracking System) software scans your resume before a human ever sees it. Each check below is explained in plain language — no jargon.</p>
            </div>
          </div>
          <div class="card" style="overflow:hidden">
            ${safeAtsChecks.length ? safeAtsChecks.map(c => `<div class="atsrow">
              <i data-lucide="${c.status==='pass'?'check-circle-2':c.status==='warn'?'alert-triangle':'x-circle'}" class="ic4" style="margin-top:3px;color:${c.status==='pass'?'var(--success)':c.status==='warn'?'var(--warn)':'var(--danger)'}"></i>
              <div><p class="nm">${esc(c.name || 'ATS check')}</p><p>${esc(c.detail || '')}</p></div></div>`).join('') : '<div class="card panel"><p class="empty-note">ATS checks are unavailable for this analysis.</p></div>'}
          </div>
        </div>
      </div>

      <div data-p="keywords" hidden>
        <div class="overview">
          <div class="honest"><i data-lucide="info" class="ic4" style="color:var(--accent);margin-top:2px"></i>
            <p><b>A note on honesty:</b> add keywords only when they genuinely represent your skills or experience. Weaving them naturally into bullets and projects beats keyword stuffing — recruiters (and interviews) will notice the difference.</p></div>
          ${[['Found keywords','Already present in your resume — good.','ok', safeMatchingKeywords, false],
             ['Missing keywords','Important for this role but absent from your resume.','miss', safeMissingKeywords.slice(0,14), true],
             ['Recommended keywords','Commonly valued in this role — add only the ones that are true for you.','rec', safeRecommendedKeywords, false]]
            .filter(g => g[3].length).map(([t,h,tone,words,miss]) => `
            <div class="card panel"><h2>${t} <span class="cnt">(${words.length})</span></h2><p class="hint">${h}</p>
              <div class="kwrap" style="margin-top:14px">${words.map(w => `<span class="chip ${tone}"><i data-lucide="${miss?'x':'check'}" class="ic3"></i>${esc(w)}</span>`).join('')}</div></div>`).join('')}
          ${safeMatchingKeywords.length === 0 ? '<div class="card panel"><p class="empty-note">None found for this role yet.</p></div>' : ''}
        </div>
      </div>

      <div data-p="skills" hidden>
        <div class="overview">
          <div class="card panel">
            <div class="pct"><div><h2 style="font-size:17px">Skill match</h2><p class="hint">Resume skills vs job requirements</p></div>
            <b style="color:${scoreColor(a.skillMatchPercent)}" class="tnum">${a.skillMatchPercent}%</b></div>
            <div class="progress" style="height:12px;margin-top:16px"><i style="width:${a.skillMatchPercent}%;background:${scoreColor(a.skillMatchPercent)}"></i></div>
          </div>
          <div class="two">
            <div class="card panel"><h2>Matching skills <span class="cnt">(${safeMatchingSkills.length})</span></h2>
              <div class="kwrap" style="margin-top:14px">${safeMatchingSkills.length ? safeMatchingSkills.map(s => `<span class="chip ok"><i data-lucide="check" class="ic3"></i>${esc(s)}</span>`).join('') : '<p class="empty-note">No direct matches found for this role.</p>'}</div></div>
            <div class="card panel"><h2>Missing skills <span class="cnt">(${safeMissingSkills.length})</span></h2>
              <div class="kwrap" style="margin-top:14px">${safeMissingSkills.length ? safeMissingSkills.slice(0,12).map(s => `<span class="chip miss"><i data-lucide="x" class="ic3"></i>${esc(s)}</span>`).join('') : '<p class="empty-note">You cover the full expected skill set.</p>'}</div>
              ${safeSkillGaps.length ? `<div class="fixbox" style="background:var(--accent-soft)"><b>Plan:</b> close 1–2 of these gaps with a focused project or coursework before listing them. Prioritise: ${esc(safeSkillGaps.slice(0,3).join(', '))}.</div>` : ''}
            </div>
          </div>
        </div>
      </div>

      <div data-p="improve" hidden>
        <div class="overview">
          <div class="card panel">
            <h2><i data-lucide="sparkles" class="ic4" style="color:var(--accent)"></i>Resume Summary Generator</h2>
            <p class="hint">Describe yourself in four fields — get a concise, professional summary.</p>
            <div style="display:grid;gap:15px;margin-top:18px" class="two">
              <div><label class="f">Target job</label><input class="input" id="sgRole" value="${esc(a.jobRole)}" list="sgRoles">
                <datalist id="sgRoles">${JOB_ROLES.map(r => `<option value="${r}">`).join('')}</datalist></div>
              <div><label class="f">Experience level</label><select class="input" id="sgLevel">
                <option value="fresher">Fresher / Student</option><option value="mid">1–5 years</option><option value="senior">5+ years</option></select></div>
              <div><label class="f">Top skills</label><input class="input" id="sgSkills" value="${esc(a.matchingSkills.slice(0,6).join(', '))}" placeholder="React, Node.js, MongoDB"></div>
              <div><label class="f">Career goals (optional)</label><input class="input" id="sgGoals" placeholder="work on large-scale product teams"></div>
            </div>
            <div style="display:flex;flex-wrap:wrap;gap:9px;margin-top:18px">
              <button class="btn" id="sgGo">Generate</button>
              <button class="btn outline" id="sgRe" style="display:none"><i data-lucide="refresh-cw" class="ic3"></i>Regenerate</button>
              <button class="btn outline" id="sgCopy" style="display:none"><i data-lucide="copy" class="ic3"></i>Copy</button>
            </div>
            <div id="sgOut" class="imp" style="display:none;margin-top:16px"></div>
          </div>
          <div class="card panel">
            <h2><i data-lucide="wand-2" class="ic4" style="color:var(--accent)"></i>Bullet Point Improver</h2>
            <p class="hint">Paste a weak bullet — get an achievement-oriented rewrite using Action + Task + Technology + Result.</p>
            <textarea class="input" id="biIn" style="margin-top:16px" placeholder="Worked on a website using React."></textarea>
            <div style="display:flex;flex-wrap:wrap;gap:9px;margin-top:14px">
              <button class="btn" id="biGo">Improve bullet</button>
              <button class="btn outline" id="biCopy" style="display:none"><i data-lucide="copy" class="ic3"></i>Copy</button>
            </div>
            <div id="biOut" style="display:none;margin-top:16px"></div>
            <p style="margin-top:12px;font-size:12px;color:var(--faint)">Bracketed placeholders mark where a real metric belongs — never invent numbers.</p>
          </div>
          <div class="honest"><i data-lucide="gauge" class="ic4" style="color:var(--accent);margin-top:2px"></i>
            <p>Improvements compound: fix the summary, rewrite your weakest bullets, add honest keywords — then re-run the analysis to watch your ATS score move.</p></div>
        </div>
      </div>
    </div>`;

  const saveBtn = root.querySelector('#saveAnalysisBtn');
  if (saveBtn) {
    saveBtn.onclick = () => {
      const uidVal = a.id || uid();
      const existing = analyses().find(x => x.id === uidVal);
      const entry = { ...a, id: uidVal, userId: currentUser()?.id || existing?.userId || 'guest', createdAt: a.createdAt || nowIso() };
      const nextAnalyses = existing ? analyses().map(x => x.id === uidVal ? { ...x, ...entry } : x) : [...analyses(), entry];
      saveAnalyses(nextAnalyses);
      toast(existing ? 'Analysis updated and saved.' : 'Analysis saved to your history.','ok');
      renderAnalysisInto(root, entry, opts);
    };
  }

  const deleteBtn = root.querySelector('#deleteAnalysisBtn');
  if (deleteBtn) {
    deleteBtn.onclick = () => {
      confirmDialog({
        title: 'Delete this resume analysis?',
        description: 'This removes the stored analysis and also deletes the linked resume from your saved files.',
        onYes: () => {
          const relatedResumeId = a.resumeId || (a.resumeFileName ? resumes().find(r => r.fileName === a.resumeFileName && r.userId === currentUser()?.id)?.id : null);
          saveAnalyses(analyses().filter(x => x.id !== a.id));
          if (relatedResumeId) {
            saveResumes(resumes().filter(r => r.id !== relatedResumeId));
          }
          localStorage.removeItem('ara_applied_' + a.id);
          toast('Resume and analysis deleted.','ok');
          if (window.location.hash.startsWith('#/analysis/')) {
            window.location.hash = '#/history';
          } else {
            viewHistory();
          }
        }
      });
    };
  }

  /* tabs */
  $$('#aTabs .tab').forEach(b => b.onclick = () => {
    $$('#aTabs .tab').forEach(x => x.classList.toggle('on', x === b));
    $$('#aPanels > div').forEach(p => p.hidden = p.dataset.p !== b.dataset.t);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  /* suggestion copy / apply */
  root.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => copyText(a.suggestions[+b.dataset.copy].improved, 'Suggestion copied.'));
  root.querySelectorAll('[data-apply]').forEach(b => b.onclick = () => {
    const i = +b.dataset.apply;
    applied = applied.includes(i) ? applied.filter(x => x !== i) : [...applied, i];
    DB.set('applied_' + a._id, applied);
    toast(applied.includes(i) ? 'Marked as applied — paste it into your resume when you edit next.' : 'Marked as not applied.', 'ok');
    renderAnalysisInto(root, a, opts);
    /* stay on the tab the user was on */
    const cur = root.querySelector('#aTabs .tab.on')?.dataset.t || 'overview';
    $$('#aTabs .tab').forEach(x => x.classList.toggle('on', x.dataset.t === cur));
    $$('#aPanels > div').forEach(p => p.hidden = p.dataset.p !== cur);
  });

  /* summary generator */
  let sgVariant = 0;
  const sgRun = v => {
    const skills = $('#sgSkills').value.split(',').map(s => s.trim()).filter(Boolean);
    const out = generateSummary({ targetJob: $('#sgRole').value.trim(), level: $('#sgLevel').value, skills, goals: $('#sgGoals').value.trim(), variant: v });
    $('#sgOut').textContent = out; $('#sgOut').style.display = '';
    $('#sgRe').style.display = ''; $('#sgCopy').style.display = '';
  };
  $('#sgGo').onclick = () => { sgVariant = 0; sgRun(0); };
  $('#sgRe').onclick = () => { sgVariant++; sgRun(sgVariant); };
  $('#sgCopy').onclick = () => copyText($('#sgOut').textContent, 'Summary copied.');
  $('#biGo').onclick = () => {
    const t = $('#biIn').value.trim();
    if (t.length < 10) return toast('Please paste a full bullet point (10+ characters).','error');
    const improved = improveBullet(t);
    $('#biOut').style.display = '';
    $('#biOut').innerHTML = `<div style="display:grid;gap:12px" class="two">
      <div><p class="curlab">Current</p><p class="cur">“${esc(t)}”</p></div>
      <div><p class="curlab" style="color:var(--accent)">Improved</p><p class="imp">${esc(improved)}</p></div></div>`;
    $('#biCopy').style.display = '';
    $('#biCopy').onclick = () => copyText(improved, 'Improved bullet copied.');
  };
  setupAiChat(root);
  animateRings(root);
  icons();
}

function viewAnalysis(id){
  const list = myAnalyses();
  const a = id === 'latest' ? list[0] : list.find(x => x.id === id);
  if (!a){
    appShell('analysis/latest', pageHead('Analysis','') +
      emptyState('file-search','Analysis not found','It may have been deleted, or it belongs to a different account. Try the latest from your history.',
        '<a href="#/history"><button class="btn outline">Back to history</button></a>'));
    return;
  }

/* ---------- job matcher ---------- */
function viewMatcher(){
  const u = currentUser();
  const list = myResumes();
  if (!list.length){
    appShell('matcher', pageHead('Job Description Matcher','') +
      emptyState('file-search','No resumes yet','Upload a resume first — then paste any job description here to see how well you match.','<a href="#/upload"><button class="btn">Upload resume</button></a>'));
    return;
  }
  appShell('matcher', `
    ${pageHead('Job Description Matcher','Paste a posting to see how your resume scores against it.')}
    <div class="two" style="margin-top:0">
      <div class="card panel">
        <label class="f">Resume</label>
        <select class="input" id="mResume">${list.map(r => `<option value="${r.id}">${esc(r.fileName)}</option>`).join('')}</select>
        <label class="f" style="margin-top:18px">Job description</label>
        <textarea class="input" id="mJd" style="min-height:250px" placeholder="Paste the full job posting — requirements, skills, nice-to-haves…"></textarea>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px">
          <span class="mono empty-note tnum" id="mCount">0 chars</span>
          <button class="btn" id="mGo"><i data-lucide="target" class="ic4"></i>Compute match</button>
        </div>
      </div>
      <div id="mResult">
        <div class="card" style="display:grid;place-items:center;padding:56px 24px;text-align:center">
          <i data-lucide="target" class="ic6" style="color:var(--faint)"></i>
          <p style="margin-top:16px;max-width:340px;font-size:13.5px;color:var(--muted)">Your match breakdown — skills, experience, education, keywords and role relevance — will appear here.</p>
        </div>
      </div>
    </div>`);
  const jdEl = $('#mJd');
  jdEl.oninput = () => $('#mCount').textContent = jdEl.value.trim().length + ' chars';
  $('#mGo').onclick = () => {
    const jd = jdEl.value.trim();
    if (jd.length < 30) return toast('Please paste a complete job description (at least a few sentences).','error');
    const rec = list.find(r => r.id === $('#mResume').value);
    const btn = $('#mGo');
    btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Computing…';
    setTimeout(() => {
      const match = analyseJobMatch(rec.text, jd);
      const base = buildAnalysis({ resumeText: rec.text, jobRole:'Job Description Match', jobDescription: jd, fileType: rec.fileType });
      const saved = { id: uid(), userId: u.id, resumeId: rec.id, resumeFileName: rec.fileName,
        jobRole:'Job Description Match', jobDescription: jd, ...base, jobMatchScore: match.matchScore,
        matchingSkills: match.topMatchingSkills, missingRequirements: match.missingRequirements,
        createdAt: nowIso() };
      saveAnalyses([...analyses(), saved]);
      $('#mResult').innerHTML = `
        <div class="overview">
          <div class="card scorehero">
            ${ringSvg(match.matchScore, 128, 'Match')}
            <div class="side">
              <h2 style="font-size:17px">${match.matchScore}% Match</h2>
              <p class="hint">Saved to your history — <a class="link" href="#/analysis/${saved.id}">open the full analysis</a></p>
              <div style="display:grid;gap:13px;margin-top:16px">
                ${match.breakdown.map(b => `<div><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px"><span style="color:var(--muted)">${b.label}</span><b class="mono tnum">${b.score}</b></div><div class="progress"><i style="width:${b.score}%;background:${scoreColor(b.score)}"></i></div></div>`).join('')}
              </div>
            </div>
          </div>
          <div class="card panel"><h2>Top matching skills</h2>
            <div class="kwrap" style="margin-top:14px">${match.topMatchingSkills.map(s => `<span class="chip ok"><i data-lucide="check" class="ic3"></i>${esc(s)}</span>`).join('')}</div></div>
          <div class="card panel"><h2>Missing requirements</h2>
            ${match.missingRequirements.length ? `<ul class="ilist" style="margin-top:14px">${match.missingRequirements.map(r => `<li><i data-lucide="x" class="ic4" style="color:var(--danger);margin-top:3px"></i><p style="font-size:13.5px;color:var(--muted)">${esc(r)}</p></li>`).join('')}</ul>` : '<p class="empty-note" style="margin-top:12px">No unmet requirement lines detected — strong position.</p>'}</div>
          <div class="card panel"><h2>Recommended improvements</h2>
            <ul class="ilist" style="margin-top:14px">${match.recommendedImprovements.map((r,i) => `<li><span style="width:6px;height:6px;border-radius:99px;background:var(--accent);display:inline-block;margin-top:8px;flex:none"></span><p style="font-size:13.5px;color:var(--muted)">${esc(r)}</p></li>`).join('')}</ul></div>
        </div>`;
      animateRings($('#mResult')); icons();
      btn.disabled = false; btn.innerHTML = '<i data-lucide="target" class="ic4"></i>Compute match';
      toast('Match computed and saved to your history.','ok');
    }, 700);
  };
}

/* ---------- history ---------- */
function viewHistory(){
  const u = currentUser();
  const list = myAnalyses();
  if (!list.length){
    appShell('history', pageHead('Analysis History','') +
      emptyState('history','No analyses yet','Every analysis you run is stored here with its scores, so you can track improvement and compare runs.','<a href="#/upload"><button class="btn">Upload resume</button></a>'));
    return;
  }
  let picked = [];
  const render = () => {
    const trend = [...list].reverse().map(a => ({ date: fmtDate(a.createdAt), score: a.atsScore, label: a.jobRole }));
    appShell('history', `
      ${pageHead('Analysis History', `${list.length} saved ${list.length===1?'analysis':'analyses'} — tick two to compare.`)}
      ${trend.length >= 2 ? `<div class="card panel" style="margin-bottom:20px"><h2><i data-lucide="trending-up" class="ic4" style="color:var(--accent)"></i>Score improvement over time</h2><div style="margin-top:12px">${lineChartSvg(trend)}</div></div>` : ''}
      <div class="card tblwrap"><table>
        <thead><tr><th>Resume</th><th>Job role</th><th>ATS</th><th>Match</th><th>Date</th><th>Compare</th><th>Actions</th></tr></thead>
        <tbody>${list.map(a => `<tr>
          <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500">${esc(a.resumeFileName || 'Resume')}</td>
          <td style="color:var(--muted)">${esc(a.jobRole)}</td>
          <td class="mono tnum" style="color:${scoreColor(a.atsScore)}">${a.atsScore}</td>
          <td class="mono tnum" style="color:${scoreColor(a.jobMatchScore)}">${a.jobMatchScore}</td>
          <td style="color:var(--muted);font-size:12.5px">${fmtDate(a.createdAt)}</td>
          <td><input type="checkbox" data-pick="${a.id}" ${picked.includes(a.id)?'checked':''} style="accent-color:var(--accent);width:16px;height:16px;cursor:pointer" aria-label="Compare ${esc(a.jobRole)}"></td>
          <td><div style="display:flex;gap:8px">
            <a href="#/analysis/${a.id}"><button class="btn outline sm"><i data-lucide="eye" class="ic3"></i>View</button></a>
            <button class="btn ghost sm" data-del="${a.id}" aria-label="Delete"><i data-lucide="trash-2" class="ic3"></i></button>
          </div></td></tr>`).join('')}
        </tbody></table></div>
      <div id="cmpBox"></div>`);
    $$('[data-pick]').forEach(cb => cb.onchange = () => {
      const id = cb.dataset.pick;
      picked = picked.includes(id) ? picked.filter(x => x !== id) : picked.length >= 2 ? [picked[1], id] : [...picked, id];
      render();
    });
    $$('[data-del]').forEach(b => b.onclick = () => {
      const a = list.find(x => x.id === b.dataset.del);
      confirmDialog({ title:'Delete this analysis?',
        description:'The stored scores and suggestions for this run will be permanently removed. Your resume file stays.',
        onYes: () => {
          saveAnalyses(analyses().filter(x => x.id !== a.id));
          localStorage.removeItem('ara_applied_' + a.id);
          picked = picked.filter(x => x !== a.id);
          toast('Analysis deleted.','ok');
          viewHistory();
        }});
    });
    if (picked.length === 2){
      const pair = picked.map(id => list.find(a => a.id === id));
      const metrics = [['Overall','overallScore'],['ATS','atsScore'],['Job match','jobMatchScore'],['Keywords','keywordScore'],['Skills','skillScore']];
      const delta = pair[0].atsScore - pair[1].atsScore;
      $('#cmpBox').innerHTML = `<div class="card panel fade" style="margin-top:20px">
        <h2>Comparing two analyses</h2>
        <div class="compare" style="margin-top:20px">
          ${pair.map(p => `<div>
            <p style="font-weight:500;font-size:14px">${esc(p.jobRole)}</p><p class="hint">${fmtDate(p.createdAt)}</p>
            <div style="display:grid;gap:11px;margin-top:14px">
              ${metrics.map(([l,k]) => `<div><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px"><span style="color:var(--muted)">${l}</span><b class="mono tnum">${p[k]}</b></div><div class="progress"><i style="width:${p[k]}%;background:${scoreColor(p[k])}"></i></div></div>`).join('')}
            </div></div>`).join('')}
        </div>
        <p class="mono" style="margin-top:20px;padding:11px 14px;border-radius:9px;font-size:12px;background:${delta>=0?'var(--success-soft)':'var(--danger-soft)'};color:${delta>=0?'var(--success)':'var(--danger)'}">ATS delta: ${delta>=0?'+':''}${delta} between the two runs</p>
      </div>`;
      icons();
    }
  };
  render();
}

  const skillChips = () => skills.length ? `<div class="kwrap" style="margin-top:12px">${skills.map(s => `<span class="chip rec"><i data-lucide="x" class="ic3" data-skill="${esc(s)}" style="cursor:pointer"></i>${esc(s)}</span>`).join('')}</div>` : '<p class="empty-note" style="margin-top:10px">No skills yet — add your strongest below.</p>';

  appShell('profile', `

      <h2>Saved resumes</h2>
      <p class="hint" style="margin-top:6px">Your uploaded resumes stay attached to this profile and can be reused without uploading again.</p>

    </div>

      <h2>Profile</h2>
      <div class="two" style="margin-top:18px">
        <div><label class="f">Name</label><input class="input" id="pfName" value="${esc(u.name)}"></div>
        <div><label class="f">Email</label><input class="input" value="${esc(u.email)}" disabled style="opacity:.6"></div>
        <div><label class="f">Target job</label><input class="input" id="pfJob" list="pfRoles" value="${esc(u.targetJob)}" placeholder="e.g. Data Analyst">
          <datalist id="pfRoles">${JOB_ROLES.map(r => `<option value="${r}">`).join('')}</datalist></div>
        <div><label class="f">Education</label><input class="input" id="pfEdu" value="${esc(u.education)}" placeholder="B.Tech in Computer Science"></div>
      </div>
      <label class="f" style="margin-top:18px">Skills</label>
      <div id="skillArea">${skillChips()}</div>
      <div style="display:flex;gap:9px;margin-top:12px">
        <input class="input" id="pfSkillIn" placeholder="Add a skill and press Enter">
        <button type="button" class="btn outline" id="pfSkillAdd"><i data-lucide="plus" class="ic4"></i>Add</button>
      </div>
      <div style="margin-top:22px"><button class="btn" type="submit"><i data-lucide="save" class="ic4"></i>Update profile</button></div>
    </form>
    <form class="card panel" id="pwForm" style="margin-top:20px">
      <h2>Change password</h2>
      <div class="two" style="margin-top:18px">
        <div><label class="f">Current</label><input class="input" id="pwCur" type="password" autocomplete="current-password"></div>
        <div><label class="f">New</label><input class="input" id="pwNew" type="password" autocomplete="new-password"></div>
        <div><label class="f">Confirm new</label><input class="input" id="pwConf" type="password" autocomplete="new-password"></div>
      </div>
      <div style="margin-top:22px"><button class="btn outline" type="submit">Change password</button></div>
    </form>
    <div class="card panel" style="margin-top:20px;border-color:color-mix(in srgb,var(--danger) 40%,transparent)">
      <h2 style="color:var(--danger)">Danger zone</h2>
      <p style="margin-top:6px;font-size:13.5px;color:var(--muted)">Deleting your account permanently removes your profile, resumes and every saved analysis.</p>
      <button class="btn danger" id="btnDelAcc" style="margin-top:16px">Delete account</button>
    </div>`);

  $$('[data-open-resume]').forEach(btn => {
    btn.onclick = () => {
      const resume = savedResumeList.find(r => r.id === btn.dataset.openResume);
      if (!resume) return;
      setLastResume(resume.id);
      toast('Saved resume loaded. You can re-use it from the upload page.','ok');
      location.hash = '#/upload';
    };
  });
  $$('[data-delete-resume]').forEach(btn => {
    btn.onclick = () => {
      const resumeId = btn.dataset.deleteResume;
      saveResumes(resumes().filter(r => r.id !== resumeId));
      if (lastResumeId() === resumeId) setLastResume(null);
      toast('Saved resume removed.','ok');
      viewProfile();
    };
  });

  const rerenderSkills = () => {
    $('#skillArea').innerHTML = skillChips(); icons();
    $$('#skillArea [data-skill]').forEach(x => x.onclick = () => {
      skills = skills.filter(s => s !== x.dataset.skill); rerenderSkills();
    });
  };
  rerenderSkills();
  const addSkill = () => {
    const v = $('#pfSkillIn').value.trim().toLowerCase();
    if (!v || skills.includes(v) || skills.length >= 30) return;
    skills.push(v); $('#pfSkillIn').value = ''; rerenderSkills();
  };
  $('#pfSkillAdd').onclick = addSkill;
  $('#pfSkillIn').onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); addSkill(); } };

  $('#profForm').onsubmit = e => {
    e.preventDefault();
    const name = $('#pfName').value.trim();
    if (name.length < 2) return toast('Name must be at least 2 characters.','error');
    Object.assign(u, { name, targetJob: $('#pfJob').value.trim().slice(0,80),
      education: $('#pfEdu').value.trim().slice(0,300), skills });
    saveUsers(users().map(x => x.id === u.id ? u : x));
    toast('Profile updated.','ok');
  };
  $('#pwForm').onsubmit = async e => {
    e.preventDefault();
    const cur = $('#pwCur').value, nw = $('#pwNew').value, conf = $('#pwConf').value;
    if ((await hashPw(cur, u.salt)) !== u.hash) return toast('Your current password is incorrect.','error');
    if (nw !== conf) return toast('New passwords do not match.','error');
    if (nw.length < 8 || !/[a-zA-Z]/.test(nw) || !/[0-9]/.test(nw)) return toast('New password must be 8+ characters with letters and numbers.','error');
    const salt = uid();
    Object.assign(u, { salt, hash: await hashPw(nw, salt) });
    saveUsers(users().map(x => x.id === u.id ? u : x));
    $('#pwCur').value = $('#pwNew').value = $('#pwConf').value = '';
    toast('Password changed.','ok');
  };
  $('#btnDelAcc').onclick = () => confirmDialog({
    title:'Delete your account?',
    description:'This cannot be undone. All resumes and analyses will be permanently removed.',
    onYes: async () => {
      saveUsers(users().filter(x => x.id !== u.id));
      saveResumes(resumes().filter(r => r.userId !== u.id));
      saveAnalyses(analyses().filter(a => a.userId !== u.id));
      logout();
      toast('Account deleted. Good luck out there!','ok');
      location.hash = '#/';
    }});
}

            ${[1,2,3,4,5].map(v => `<button type="button" class="star-btn" data-star="${v}" aria-label="Rate ${v} out of 5" style="background:none;border:1px solid var(--line);border-radius:999px;width:38px;height:38px;font-size:20px;cursor:pointer;color:var(--muted)">★</button>`).join('')}
          </div>
          <input type="hidden" id="rvRating" value="5">
        </div>
        <div><label class="f">Your review</label><textarea class="input" id="rvReview" placeholder="Write your review here…" style="min-height:150px"></textarea></div>
        <div>
          <label class="f">Upload image (optional)</label>
          <input class="input" id="rvImage" type="file" accept="image/*">
        </div>
      </div>
      <button class="btn" type="submit" style="margin-top:20px"><i data-lucide="send" class="ic4"></i>Submit review</button>
    </form>

    <div style="margin-top:32px">
      <h2 style="font-size:18px;margin-bottom:16px">Latest reviews</h2>
      <div id="reviewList" style="display:grid;gap:16px"></div>
    </div>
  </div>`);

  renderReviews();

  const stars = $$('#starRating .star-btn');
  const setStarRating = value => {
    $('#rvRating').value = value;
    stars.forEach(star => {
      const chosen = Number(star.dataset.star);
      star.style.color = chosen <= value ? 'var(--warn)' : 'var(--muted)';
      star.style.borderColor = chosen <= value ? 'var(--warn)' : 'var(--line)';
      star.style.background = chosen <= value ? 'rgba(224,179,65,.12)' : 'transparent';
    });
  };
  setStarRating(5);
  stars.forEach(star => {
    star.onclick = () => setStarRating(Number(star.dataset.star));
  });

  $('#reviewForm').onsubmit = async e => {
    e.preventDefault();
    const name = $('#rvName').value.trim();
    const rating = Number($('#rvRating').value || 5);
    const review = $('#rvReview').value.trim();
    const imageFile = $('#rvImage').files?.[0];

    if (name.length < 2) return toast('Please enter your name.','error');
    if (!review || review.trim().length === 0) return toast('Please write a review before submitting.','error');

    let image = '';
    if (imageFile) {
      if (imageFile.size > 2 * 1024 * 1024) return toast('Image is too large. Please use under 2 MB.','error');
      image = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result));
        reader.onerror = () => reject(new Error('Could not read uploaded image.'));
        reader.readAsDataURL(imageFile);
      });
    }

    const newReview = { id: uid(), name, rating, review, image, createdAt: nowIso() };
    const updated = [...getReviews(), newReview];
    DB.set('reviews', updated);
    $('#reviewForm').reset();
    setStarRating(5);
    renderReviews();
    toast('Your review has been published.','ok');
  };
}

}
function viewContact(){
  marketingWrap(`<div class="page" style="max-width:520px">
    <p class="mono" style="font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--accent)">contact</p>
    <h1 style="font-size:clamp(28px,4vw,36px);font-weight:700;margin-top:10px">Talk to the team</h1>
    <p style="margin-top:16px;font-size:14px;color:var(--muted)">Questions, feedback, or a bug the demo surfaced? Messages are saved locally in this edition — the full-stack version stores them in MongoDB.</p>
    <form class="card panel" id="ctForm" style="margin-top:26px">
      <div style="display:grid;gap:15px">
        <div><label class="f">Name</label><input class="input" id="ctName" placeholder="Your name"></div>
        <div><label class="f">Email</label><input class="input" id="ctEmail" type="email" placeholder="you@example.com"></div>
        <div><label class="f">Message</label><textarea class="input" id="ctMsg" placeholder="Tell us what you think…"></textarea></div>
      </div>
      <button class="btn" type="submit" style="margin-top:20px"><i data-lucide="send" class="ic4"></i>Send message</button>
    </form>
    <p style="display:flex;gap:8px;align-items:center;margin-top:22px" class="mono"><i data-lucide="mail" class="ic4" style="color:var(--faint)"></i><span style="font-size:12px;color:var(--faint)">team@404codex.dev</span></p>
  </div>`);
  $('#ctForm').onsubmit = e => {
    e.preventDefault();
    const name = $('#ctName').value.trim(), email = $('#ctEmail').value.trim(), msg = $('#ctMsg').value.trim();
    if (name.length < 2) return toast('Please enter your name.','error');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return toast('Please enter a valid email address.','error');
    if (msg.length < 10) return toast('Please write a short message (10+ characters).','error');
    DB.set('messages', [...DB.get('messages', []), { name, email, message: msg, createdAt: nowIso() }]);
    $('#ctName').value = $('#ctEmail').value = $('#ctMsg').value = '';
    toast('Message saved — the 404_codeX team will get back to you.','ok');
  };
}

/* ---------------- router ---------------- */
const VIEWS = {
  '': viewLanding, landing: viewLanding, login: viewLogin, register: viewRegister,
  about: viewAbout, reviews: viewReviews, contact: viewContact, demo: viewDemo,
  dashboard: viewDashboard, admin: viewAdmin, upload: viewUpload, analysis: viewAnalysis,
  matcher: viewMatcher, history: viewHistory, profile: viewProfile
};
const PROTECTED = ['dashboard','admin','upload','analysis','matcher','history','profile'];
function setPageTheme(pageKey){
  const key = (pageKey || 'landing').toString().trim() || 'landing';
  document.documentElement.setAttribute('data-page', key);
}
function route(){
  if (routeCleanup){ routeCleanup(); routeCleanup = null; }
  const hash = location.hash.replace(/^#\/?/, '');
  const [path, ...rest] = hash.split('/');
  const pageKey = path || 'landing';
  setPageTheme(pageKey);
  if (PROTECTED.includes(path) && !currentUser()){
    sessionStorage.setItem('ara_next', '#/' + hash);
    location.hash = '#/login';
    return;
  }
  const view = VIEWS[path] || viewLanding;
  view(rest.join('/'));
  window.scrollTo(0, 0);
  icons();
}

/* ---------------- boot ---------------- */
(async function init(){
  await seedDemo();
  if (!location.hash) location.replace('#/');
  window.addEventListener('hashchange', route);
  route();
})();
</script>
